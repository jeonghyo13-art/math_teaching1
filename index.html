<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 수학교육론 D-14 마스터 인출기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        /* 빈칸 인풋 스타일 */
        .blank-input {
            border: none;
            border-bottom: 2px solid #94a3b8;
            background-color: #f1f5f9;
            border-radius: 4px 4px 0 0;
            text-align: center;
            font-weight: 700;
            color: #2563eb;
            transition: all 0.2s ease;
            padding: 2px 6px;
            margin: 2px 4px;
            font-size: 0.95rem;
        }
        .blank-input:focus {
            outline: none;
            border-bottom-color: #2563eb;
            background-color: #dbeafe;
        }
        .blank-input.correct {
            border-bottom-color: #10b981;
            background-color: #d1fae5;
            color: #065f46;
            pointer-events: none;
        }
        .blank-input.wrong-revealed {
            border-bottom-color: #ef4444;
            background-color: #fee2e2;
            color: #b91c1c;
            pointer-events: none;
        }
        /* 진행바 애니메이션 */
        .progress-fill {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-3 sm:px-6 lg:px-8">

    <!-- 상단 헤더 & 모드 전환 탭 -->
    <header class="w-full max-w-4xl bg-white rounded-2xl shadow-sm p-5 sm:p-6 mb-5 border-t-4 border-indigo-600">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
            <div>
                <span class="inline-block bg-rose-100 text-rose-600 font-bold px-3 py-1 rounded-full text-xs mb-1">2026 임용 D-14 파이널</span>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-800">김민아 수학교육론 전범위 인출기</h1>
            </div>
            <!-- 탭 버튼 -->
            <div class="flex bg-slate-100 p-1 rounded-xl self-start sm:self-auto">
                <button id="tab-blank" onclick="switchMode('blank')" class="px-4 py-2 rounded-lg text-sm font-bold bg-white text-indigo-600 shadow-sm transition">
                    ✍️ 빵꾸노트 인출
                </button>
                <button id="tab-mcq" onclick="switchMode('mcq')" class="px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 transition">
                    📝 실전 객관식 150제 (5세트)
                </button>
            </div>
        </div>

        <p id="mode-desc" class="text-slate-500 text-xs sm:text-sm leading-relaxed">
            • 정답을 입력하면 즉시 채점됩니다. <strong>틀린 답을 적고 Enter(또는 다른 곳 터치)를 누르면 즉시 정답이 공개</strong>됩니다.
        </p>

        <!-- 진도율 바 -->
        <div class="mt-4 pt-4 border-t border-slate-100">
            <div class="flex justify-between text-xs sm:text-sm font-semibold text-slate-600 mb-1.5">
                <span id="progress-label">학습 완료도 (맞힘 / 오답공개 / 전체)</span>
                <span id="progress-text" class="text-indigo-600">0 / 0</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden flex">
                <div id="progress-correct" class="bg-emerald-500 h-2.5 progress-fill" style="width: 0%"></div>
                <div id="progress-wrong" class="bg-rose-400 h-2.5 progress-fill" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- 1. 빵꾸노트 (빈칸 인출) 뷰 -->
    <!-- ========================================== -->
    <main id="view-blank" class="w-full max-w-4xl">
        <!-- 영역 필터 & 전체 제어 버튼 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 mb-4 flex flex-col gap-3">
            <div id="category-filters" class="flex gap-1.5 overflow-x-auto pb-1">
                <!-- JS로 단원 필터 버튼 생성 -->
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button onclick="revealAllBlanks()" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-1.5 rounded-lg font-semibold transition text-xs sm:text-sm">
                    👀 미답변 정답 보기
                </button>
                <button onclick="resetBlanks()" class="bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 px-3 py-1.5 rounded-lg shadow-sm font-semibold transition text-xs sm:text-sm">
                    빈칸 초기화
                </button>
            </div>
        </div>

        <div id="blank-container" class="space-y-4 pb-20">
            <!-- JS로 빈칸 카드 생성 -->
        </div>
    </main>

    <!-- ========================================== -->
    <!-- 2. 실전 객관식 150문제 (5세트) 뷰 -->
    <!-- ========================================== -->
    <main id="view-mcq" class="w-full max-w-4xl hidden">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-bold bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-md">랜덤 세트 출제 (총 150제)</span>
                <div id="set-selector" class="flex gap-1.5 flex-wrap">
                    <!-- JS로 세트 버튼 1~5 생성 -->
                </div>
            </div>
            <div class="flex gap-2 self-end sm:self-auto">
                <button onclick="pickRandomSet()" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg font-semibold transition text-xs sm:text-sm">
                    🔀 다른 세트 랜덤뽑기
                </button>
                <button onclick="resetMCQ()" class="bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 px-3 py-1.5 rounded-lg shadow-sm font-semibold transition text-xs sm:text-sm">
                    현재 세트 초기화
                </button>
            </div>
        </div>

        <div id="mcq-container" class="space-y-4 pb-20">
            <!-- JS로 현재 세트 30문제 생성 -->
        </div>
    </main>

                { q: "[1세트] 오스벨(Ausubel)의 유의미 학습 원리에 대한 설명으로 옳은 것은?", options: ["점진적 분화의 원리는 특수하고 구체적인 사례를 먼저 제시한 뒤 일반적 원리로 나아가는 것이다.", "통합적 조정의 원리는 새 학습 내용과 기존 내용의 유사성과 차이점을 분명히 식별하여 통합하는 것이다.", "잠재적 거리가 길수록 학생들이 새로운 지식을 직관적으로 빠르게 습득할 수 있다.", "포섭은 포괄성이 낮은 하위 지식이 포괄성이 높은 상위 지식을 흡수하는 과정이다."], ans: 1, exp: "통합적 조정은 유사성과 차이점을 분명히 식별해 통합하는 원리입니다." },
                { q: "[1세트] 20세기 초 수학기초론 학파들과 그 한계점에 대한 설명으로 옳지 않은 것은?", options: ["논리주의의 러셀은 역리를 피하기 위해 유형론을 제안했으나 자명하지 않은 공리들을 받아들여야 하는 한계가 있었다.", "직관주의는 유한 번의 구성 가능성을 강조하며 무한집합에 배중률을 적용하는 것을 거부하였다.", "형식주의의 힐버트는 수학을 완전한 형식 체계로 보았으나, 괴델이 무모순인 공리 체계는 불완전함을 증명하였다.", "직관주의의 관점을 따를 경우 기존의 거의 모든 고전 수학 지식을 더 풍부하게 확장할 수 있다."], ans: 3, exp: "직관주의를 따르면 구성 가능하지 않은 많은 기존 수학적 지식을 포기해야 합니다." },
                { q: "[1세트] 폰 글라저스펠트의 급진적 구성주의에서 도출되는 원리로 옳지 않은 것은?", options: ["지식은 언어를 통해 그대로 전달될 수 없으며 개인의 추상화 과정에 의해 능동적으로 구성된다.", "수학적 지식의 확실성은 객관적 실재와의 일치 여부가 아니라 적합성, 적응성으로 대치되어야 한다.", "개별 주체들의 의사소통은 객관적 실재의 보편적 본질로부터 도출되기 때문에 가능하다.", "교사는 안내자로서 학생 개개인이 다양한 방식으로 지식을 구성하는 것을 격려해야 한다."], ans: 2, exp: "개별 주체들의 의사소통은 주관적 경험 세계의 '상대적 합의 영역'이 존재할 때 가능합니다." },
                { q: "[1세트] 사회적 구성주의에 대한 설명으로 옳지 않은 것은?", options: ["급진적 구성주의의 '지식의 비객관성 원리'를 '지식의 사회적 구성'으로 수정·보완하였다.", "사회적 구성주의에서 말하는 '객관성'은 '사회적 합의 가능성'을 의미한다.", "어니스트는 급진적 구성주의의 '언어의 비공유성' 대신 '언어의 사회적 공유성'을 강조하였다.", "개인의 주관적 지식은 공적 비판을 거치지 않고도 내면화 과정을 통해 곧바로 객관적 지식이 된다."], ans: 3, exp: "공표된 주관적 지식이 공적 비판과 재구성을 거쳐 객관적 지식이 되고, 이후 내면화됩니다." },
                { q: "[1세트] 라카토스(Lakatos)의 전면적 반례 처리 방법 중 용어를 재정의하여 반례를 추측 영역 밖으로 몰아내는 방법은?", options: ["괴물배제법", "예외배제법", "보조정리합체법", "귀류법"], ans: 0, exp: "개념의 정의를 수정하여 반례(괴물)를 추측 영역 밖으로 배제하는 것은 괴물배제법입니다." },
                { q: "[1세트] 프로이덴탈(Freudenthal)의 수학화 교수·학습론 용어에 대한 설명으로 옳지 않은 것은?", options: ["기성수학은 결과에 초점을 둔 수학이고, 실행수학은 인간 활동으로서의 수학화 과정에 초점을 둔 수학이다.", "수평적 수학화는 현실 세계의 문제 장면을 형식적인 수학적 처리가 가능하도록 변환하는 것이다.", "수직적 수학화는 추상화된 기호의 세계에서 기호들이 계속 형성되고 세련화되는 과정이다.", "반교수학적 전도는 현상으로부터 출발하여 점진적으로 본질에 이르도록 하는 이상적인 지도 원리이다."], ans: 3, exp: "반교수학적 전도는 본질을 먼저 부과하는 잘못된 접근 방식을 비판하는 용어입니다." },
                { q: "[1세트] 반 힐레(van Hiele)의 기하 학습 수준 이론에 대한 설명으로 옳지 않은 것은?", options: ["제1수준(시각적)에서는 도형을 전체 모양새로 인식하며 도형의 성질에는 주목하지 않는다.", "제2수준(분석적)에서는 도형의 성질을 분석하지만 도형 간의 포함 관계나 위계적 분류는 하지 못한다.", "제3수준(관계적)에서는 도형을 위계적으로 분류할 수 있으나 국소적인 연역적 추론조차 불가능하다.", "제4수준(형식적 연역)에서는 무정의 용어, 공리, 정의, 정리의 차이를 인식하고 공리적 체계 내에서 증명한다."], ans: 2, exp: "제3수준에서는 비형식적 논증과 국소적(소규모) 연역적 추론이 가능합니다." },
                { q: "[1세트] 폴리아(Polya)의 문제해결 4단계 중 '반성(Looking back)' 단계에서의 교사 발문으로 가장 적절한 것은?", options: ["문제에서 미지인 것은 무엇이며 주어진 조건은 충분한가?", "전에 이와 유사하거나 관련된 문제를 풀어본 적이 있는가?", "풀이의 각 단계가 올바른지 명확히 증명할 수 있는가?", "결과나 방법을 다른 문제에 활용할 수 있으며, 다른 방법으로 해결할 수는 없는가?"], ans: 3, exp: "다른 방법 탐색, 결과와 방법의 다른 문제 활용은 '반성' 단계의 발문입니다." },
                { q: "[1세트] 쇤펠드(Schoenfeld)의 문제해결 행동 결정 요인 4가지에 대한 설명으로 옳지 않은 것은?", options: ["자원: 개인이 문제해결에 사용할 수 있는 수학적 지식, 알고리즘, 직관 등이다.", "발견술: 유추, 일반화, 특수화 등 생소한 문제를 풀기 위한 전략으로 완전한 해결을 보장한다.", "통제: 자원과 전략의 선택 및 수행을 감시·평가하는 메타인지적 의사결정 능력이다.", "신념 체계: 수학 문제의 풀이는 한 가지뿐이라는 등 학습자가 가진 수학에 대한 가치관이다."], ans: 1, exp: "발견술은 완전한 해결을 보장하지는 않지만 해결에 도움을 주는 전략입니다." },
                { q: "[1세트] 수학적 모델링 사이클 6단계에 대한 설명으로 옳지 않은 것은?", options: ["형식화 단계는 실제 상황을 단순화·구조화하여 수학적 모델로 변환하는 과정이다.", "계산 단계는 수학적 모델 내에서 수학적 능력을 사용해 수학적 결과를 도출하는 단계이다.", "해석 단계는 수학적 결과에 현실 맥락의 의미를 부여하는 단계로 수학과 현실을 모두 포함한다.", "검증 단계는 수학적 계산의 오류가 없는지 검산하는 순수 수학적 세계 내부의 과정이다."], ans: 3, exp: "검증은 해석된 결과가 실제 현상에 부합하는지 확인하는 '실세계의 일부'입니다." },
                { q: "[1세트] 브루소(Brousseau)의 교수학적 상황론 개념에 대한 설명으로 옳지 않은 것은?", options: ["비교수학적 상황은 교사의 교수학적 의도가 감추어져 학생 스스로 수학적 지식을 도구로 활용하는 상황이다.", "책임의 양도는 교수학적 상황이 비교수학적 상황으로 전환되기 위해 학습 책임을 교사에서 학생으로 넘기는 것이다.", "교수학적 계약은 수업에서 교사와 학생이 서로에게 수행해야 할 수학적 의무와 규칙들의 집합이다.", "타당화 상황은 교사가 개입하여 학생들의 구성 결과를 공인하고 공식 용어로 정리해 주는 마지막 단계이다."], ans: 3, exp: "교사가 개입하여 구성 결과를 공인하고 정리하는 단계는 '제도화 상황'입니다." },
                { q: "[1세트] 극단적인 교수 현상 4가지에 대한 연결이 옳지 않은 것은?", options: ["메타-인지 이동: 수학적 지식 자체보다 교수학적 보조 수단에 학생들의 사고가 집중되는 현상", "형식적 고착: 개인화/배경화 과정을 무시하고 일반화된 공식의 기계적 연습에만 의존하는 현상", "토파즈식 외면치레: 교사가 과도한 힌트나 정답을 떠먹여 주어 학생이 스스로 학습할 기회를 제거하는 현상", "조르단식 외면치레: 교사가 교수학적 계약을 방기하여 학생이 아무런 학습 활동도 하지 않고 방치되는 현상"], ans: 3, exp: "학생의 사소한 행동을 과대평가하여 수학 지식을 형성했다고 잘못 판단하는 것이 조르단식 외면치레입니다." },
                { q: "[1세트] 브루소의 '인식론적 장애'에 대한 설명으로 옳지 않은 것은?", options: ["특정 맥락에서는 유용했던 지식이 확장된 문맥에서는 부적합해지는 지식이다.", "교사의 잘못된 교수법 때문에만 발생하므로 교수학적 처치를 통해 사전에 완전히 제거해야 한다.", "수학의 역사적 발생 과정에서 나타난 장애가 학생들에게도 유사하게 나타난다.", "일상어, 직관, 과도한 일반화 등이 인식론적 장애 형성에 영향을 줄 수 있다."], ans: 1, exp: "인식론적 장애는 지식 자체의 본성에 기인하는 피할 수 없는 장애이며 극복해야 할 대상입니다." },
                { q: "[1세트] 서술형 문항의 채점 절차 및 점수화 방법에 대한 설명으로 옳은 것은?", options: ["모범답안과 채점 기준을 작성한 후에는 공정성을 위해 가채점 없이 즉시 전체 답안을 채점해야 한다.", "총체적 점수화 방법은 단계별 채점 요소를 세워 점수를 부여하므로 채점자 간 객관성 유지에 가장 유리하다.", "분석적 점수화 방법은 학생의 강약점에 대한 진단적 분석과 형성적 피드백 제공에 유리하다.", "분석적 점수화 방법에서는 한 단계의 채점 결과가 다음 단계의 채점 결과에 연동되도록 엄격히 감점한다."], ans: 2, exp: "분석적 점수화 방법은 단계별 점수를 부여해 객관성과 진단적 피드백에 유리합니다." },
                { q: "[1세트] 컴퓨터를 이용한 수학 교수·학습 양식 4가지의 연결이 옳은 것은?", options: ["개인 교사형 - LOGO, BASIC", "학생 주도형 - CAI 소프트웨어, Geometry Tutor", "보조 도구형 - Maple, Mathematica (CAS)", "탐구 학습형 - 단순 연산 드릴용 프로그램"], ans: 2, exp: "보조 도구형은 CAS(Maple, Mathematica) 등 연산·그래프 처리 소프트웨어를 말합니다." }
            ],

            [
                { q: "[2세트] 독일의 클라인(Klein)이 주장한 수학교육 개혁 입장으로 옳지 않은 것은?", options: ["페스탈로치와 헤르바르트의 전통 위에 기초한 직관적 관찰과 실험·실측을 강조하였다.", "유클리드 원론은 성인을 위해 쓰인 책이므로 학생 심리에 맞는 초보 기하를 지도하자고 하였다.", "기능(skill) 위주의 내용을 강화하고 추상적 측면을 완전히 배제하여 실용성만 강조하였다.", "연역적 사고와 귀납적 사고가 균형을 이루도록 지도할 것을 강조하였다."], ans: 2, exp: "클라인은 추상적 측면과 실용적 측면의 균형을 유지하고, 실제적 내용을 중시하며 기능(skill) 위주의 내용을 경감할 것을 주장했습니다." },
                { q: "[2세트] 수학교육 현대화 운동이 발생하게 된 4가지 요인에 해당하지 않는 것은?", options: ["제2차 세계대전 이후 고도의 추상화와 집합론 도입으로 성장한 현대수학 자체의 발달", "대학의 전문 수학과 학교의 고전적 수학 내용 사이의 괴리에 대한 반성", "자연과학뿐 아니라 인문·사회과학까지 확대된 현대수학의 강력한 응용성에 대처할 필요성", "생활 중심 진보주의 교육의 과도한 추상화로 인한 학생들의 기초 연산 능력 저하"], ans: 3, exp: "기초 연산 능력 저하에 대한 반발은 현대화 운동 이후에 나타난 '기본으로 돌아가기' 운동의 요인입니다." },
                { q: "[2세트] 수학교육 현대화 운동에서 새로운 지도법 도입에 기여한 심리학자 및 이론의 연결이 옳은 것은?", options: ["피아제의 조작적 심리학 - 아동의 발달 단계 규명에 기여", "손다이크의 효과의 법칙 - 집합론의 공리적 체계 구축에 기여", "스키너의 프로그램 학습 - 비유클리드 기하의 직관적 탐구에 기여", "반 힐레의 수준 이론 - 대수적 구조의 조기 형식화에 기여"], ans: 0, exp: "피아제의 조작적 심리학은 수학 개념과 관련된 아동 발달 단계 규명에 기여했고, 브루너의 대담한 가설이 현대화 운동 파급에 결정적 역할을 했습니다." },
                { q: "[2세트] 손다이크(Thorndike)의 산술 추론 지도에 대한 견해로 옳은 것은?", options: ["추론적 사고는 습관의 법칙과 정반대되는 독립적인 정신 능력이다.", "산술 법칙의 연역적 설명은 초등학교 저학년부터 철저히 훈련시켜야 한다.", "추론 역시 여러 종류의 습관이 결합되고 조화를 이루는 것으로 보았다.", "일반적인 연역적 산술 이론은 나중에 잊히더라도 초기 계산 숙달을 위해 먼저 암기시킨다."], ans: 2, exp: "손다이크는 추론 역시 습관의 법칙과 독립된 것이 아니라 여러 습관이 결합·조화를 이루는 것으로 보았으며, 연역적 설명은 5학년 정도에 가능하고 나중에 형성한 습관의 통합체로서 학습되어야 한다고 보았습니다." },
                { q: "[2세트] 형태심리학자 쾰러(Köhler)의 침팬지 상자 실험이 수학교육에 시사하는 '통찰'의 의미는?", options: ["목표물인 바나나에만 시선을 고정하여 반복적으로 뛰어오르는 시행착오 과정", "문제 사태를 전체적으로 이해하고 한 요소(상자)를 전체와 관련시켜 도구로 재구조화하는 심리 과정", "상자를 쌓는 행동을 교사가 단계별로 시범 보여 모방하게 하는 훈련 과정", "과거에 학습한 공식에 수치를 대입하여 기계적으로 답을 산출하는 과정"], ans: 1, exp: "쾰러는 목표와 주변 요소를 포함한 문제 사태 전체를 파악하여 요소를 도구로 재구조화하는 심리 과정을 '통찰'로 설명했습니다." },
                { q: "[2세트] 폴리아(Polya)의 문제해결 전략을 형태심리학(게슈탈트) 입장에서 해석할 때 가장 적절한 것은?", options: ["문제해결을 위한 습관적 반응을 강화하는 자극-반응의 연결 고리이다.", "해결될 문제의 기초 구조의 발견을 활성화시키고 통찰력을 향해 체계적으로 나아가게 돕는 힌트이다.", "학생의 기억 용량 한계를 극복하기 위한 단순 암기 보조 장치이다.", "정의적 태도만을 평가하기 위한 면담 체크리스트이다."], ans: 1, exp: "게슈탈트 입장에서 폴리아의 발문과 단계는 문제의 기초 구조 발견을 활성화하고 통찰력으로 나아가도록 돕는 방법입니다." },
                { q: "[2세트] 피아제의 반영적 추상화 메커니즘에 대한 설명으로 옳지 않은 것은?", options: ["반사(projection)는 전 단계에서 얻은 것을 보다 상위의 단계로 옮기는 것이다.", "행동의 내면화는 행동을 의식하고 다른 행동과 결합할 수 있게 하는 내적 구성이다.", "반성에 의해 새로운 형식이 구성되는 과정은 동화와 조절의 균형화 과정에서 나타난다.", "반영적 추상화는 물리적 대상의 색깔이나 무게를 관찰하는 감각적 지각만으로 완성된다."], ans: 3, exp: "대상의 물리적 성질을 관찰해 끌어내는 것은 경험적 추상화이며, 반영적 추상화는 행동의 조정과 반사·반성을 통해 이루어집니다." },
                { q: "[2세트] 브루너(Bruner)가 제시한 수학교육의 궁극적 목적은 무엇인가?", options: ["빠르고 정확한 지필 계산 능력의 숙달", "수학적 안목의 형성", "기계적 알고리즘의 완벽한 자동화", "논리주의에 입각한 공리 체계의 암기"], ans: 1, exp: "브루너는 지식의 구조를 가르쳐 학생이 학자와 본질상 동일한 지적 활동을 하게 함으로써 '수학적 안목의 형성'을 추구했습니다." },
                { q: "[2세트] 브루너와 피아제 이론의 공통점과 차이점에 대한 설명으로 옳은 것은?", options: ["브루너는 피아제 이론을 전면 거부하고 행동주의 학습 이론을 수용하였다.", "브루너는 개인의 자주적 형성보다 교육적 전달과 전달 수단으로서 언어의 역할을 더 강조하였다.", "피아제는 언어적 설명을 통한 지식 전수를 인지 발달의 핵심 동력으로 보았다.", "두 학자 모두 아동의 발달 단계에 따라 가르칠 수 있는 교과의 내용이 엄격히 제한된다고 보았다."], ans: 1, exp: "브루너는 피아제 이론을 본질적으로 수용하면서도, 교육적 전달과 언어의 역할을 강조한 점에서 차별화됩니다." },
                { q: "[2세트] 딘즈(Dienes)의 수학 학습 4원리에 대한 설명으로 옳지 않은 것은?", options: ["역동적 원리: 예비놀이 → 구조화된 놀이 → 실습놀이의 순차적 경험을 제공한다.", "구성의 원리: 아동은 분석적 사고 이전에 구성적 사고를 발달시키므로 구성을 우선시한다.", "지각적 다양성의 원리: 동일한 개념 구조에 대해 다양한 교구나 외형적 표현을 제공한다.", "수학적 다양성의 원리: 개념 자체의 본질적 성질을 계속 바꾸면서 동일한 수치를 반복 적용한다."], ans: 3, exp: "수학적 다양성의 원리는 개념의 본질은 변하지 않게 유지하면서 개념을 구성하는 여러 변인을 변화시키는 원리입니다." },
                { q: "[2세트] 딘즈의 수학 개념 학습 6단계 중 '표현 단계'와 '기호화 단계'의 차이점으로 옳은 것은?", options: ["표현 단계에서는 반드시 국제적으로 통용되는 엄격한 수학 기호만 사용해야 한다.", "기호화 단계에서는 그림이나 일상 언어로만 표현하고 문자 기호는 배제한다.", "표현 단계는 파악한 공통성을 그림·언어·전형적 예 등 자유로운 방법으로 표현하며, 기호화 단계는 수학적 기호를 이용해 표현한다.", "기호화 단계가 먼저 이루어진 후 자유놀이와 표현 단계로 나아간다."], ans: 2, exp: "4단계(표현)에서는 그림, 언어, 예 등 다양한 방법으로 표현하고, 5단계(기호화)에서는 의사소통을 위해 공통의 수학적 기호를 사용합니다." },
                { q: "[2세트] 스켐프(Skemp)가 설명하는 '개념'과 '개념 학습의 원리'에 대한 내용으로 옳지 않은 것은?", options: ["추상화는 경험 사이의 유사성을 인식하는 활동이고, 그 마지막 결과인 추상을 '개념'이라 부른다.", "개념을 알고 있는가의 기준은 개념의 정의를 토씨 하나 틀리지 않고 암송할 수 있는가이다.", "이미 가진 개념보다 더 높은 차원의 개념은 정의가 아니라 적절한 예들을 함께 모음으로써 학습된다.", "추상의 새로운 단계에서는 매번 모든 선행 개념이 사용 가능한 상태여야 한다."], ans: 1, exp: "스켐프에 따르면 개념을 아는 기준은 이름을 말하는 것이 아니라, 유사성에 따라 새로운 정보를 올바르게 분류할 수 있는가입니다." },
                { q: "[2세트] 스켐프의 '스키마식 학습'의 장단점에 대한 설명으로 옳은 것은?", options: ["독립된 과제를 단기적으로 암기할 때 기계적 학습보다 시간이 훨씬 적게 걸린다.", "기존 스키마에 맞지 않는 새로운 내용은 학습하기 어렵게 만드는 단점이 있다.", "장래 학습 과제에 대한 적응력을 떨어뜨려 전이를 방해한다.", "스키마를 계속 사용하면 초기 개념의 기억이 점점 약화된다."], ans: 1, exp: "스키마식 학습은 효과적이고 적응력 있는 정신적 도구를 주지만, 독립된 과제 학습 시 시간이 더 걸리고 기존 스키마에 맞지 않는 것은 학습하기 어렵게 하는 단점이 있습니다." },
                { q: "[2세트] 비고츠키의 근접발달영역(ZPD) 4단계 중 '과제 수행이 내면화·자동화되어 타인의 도움 없이 수행하다가, 새로운 능력 발달을 위해 다시 ZPD가 순환되는 단계'는?", options: ["1단계", "2단계", "3단계", "4단계 (탈자동화 단계)"], ans: 3, exp: "1단계(타인 도움) → 2단계(자기 주도 과도기) → 3단계(내면화·자동화) → 4단계(새로운 발달을 위한 순환·탈자동화)입니다." },
                { q: "[2세트] 비고츠키와 폴리아, 프로이덴탈이 공통적으로 중시한 학습 메커니즘과 관련이 깊은 것은?", options: ["비고츠키와 폴리아는 교사에 대한 '모방'의 중요성을 언급하였고, 프로이덴탈은 '안내된 재발명'을 주장하였다.", "세 학자 모두 교사의 개입을 완전히 배제한 자유 방임적 발견 학습을 주장하였다.", "세 학자 모두 지필 계산의 기계적 반복 훈련만을 강조하였다.", "세 학자 모두 발달이 완전히 끝난 후에만 교육이 가능하다고 보았다."], ans: 0, exp: "비고츠키와 폴리아는 교사에 대한 모방을 중요하게 보았고, 프로이덴탈은 모방이라는 단어 대신 '안내된 재발명'이라는 개념을 사용했습니다." },
                { q: "[2세트] 오스벨의 유의미 수용학습에서 '관련 정착 아이디어와 새로운 지식 사이의 거리'를 의미하는 용어와 그 특징은?", options: ["잠재적 거리 - 짧으면 새 지식 이해·습득에 도움이 되고, 길면 탐구 능력 발달에 유용하다.", "근접발달영역 - 길수록 교사의 개입 없이 즉각적인 암기가 가능하다.", "반교수학적 전도 - 짧을수록 형식적 증명의 엄밀성이 훼손된다.", "인지적 불균형 - 길수록 동화만으로 모든 문제가 해결된다."], ans: 0, exp: "오스벨은 관련 정착 아이디어와 새 지식 사이의 거리를 '잠재적 거리'라 정의했습니다." },
                { q: "[2세트] 수학기초론 중 힐버트(Hilbert)의 형식주의에 대한 설명으로 옳지 않은 것은?", options: ["집합론의 역리는 정의와 증명의 정확성·엄밀성 부족에서 생긴다고 보았다.", "수학을 추상적 기호를 다루는 완전한 형식 체계(일종의 게임 체계)로 보았다.", "기호가 의미하는 내용적 진리성이 가장 중요하며 다른 기호로 대체할 수 없다.", "괴델의 불완전성 정리로 인해 무모순성과 완전성을 동시에 입증하려는 시도가 한계에 부딪혔다."], ans: 2, exp: "형식주의에서는 기호가 의미하는 내용은 문제가 되지 않으며 기호를 다루는 규칙 체계의 건전성(무모순성)이 핵심입니다." },

                { q: "[2세트] 구성주의 수학 교수·학습의 4가지 원리에 해당하지 않는 것은?", options: ["학생 중심적 개별화의 원리", "발문 중심적 상호 작용의 원리", "의미 지향적 활동의 원리", "교사 주도적 일제 주입의 원리"], ans: 3, exp: "구성주의 4원리는 ① 학생 중심적 개별화, ② 발문 중심적 상호작용, ③ 의미 지향적 활동, ④ 반영적 추상화의 원리입니다." },
                { q: "[2세트] 라카토스(Lakatos)가 제시한 '수학적 지식 성장 과정' 4단계가 바르게 나열된 것은?", options: ["수학적 추측 제기 → 추측을 부분 추측으로 분해 → 반례 등장 및 반박 → 증명 검토 및 추측 개선", "추측 분해 → 수학적 추측 제기 → 증명 완성 → 반례 배제", "반례 등장 → 수학적 추측 제기 → 공리화 → 형식적 증명", "공리 설정 → 연역적 증명 → 반례 무시 → 정리 확립"], ans: 0, exp: "라카토스의 지식 성장 4단계는 ① 추측 제기 → ② 부분 추측 분해 → ③ 반례 등장과 반박 → ④ 증명 검토와 추측·증명 개선입니다." },

                { q: "[2세트] 프로이덴탈이 말한 '반성(Reflection)'의 정의와 역할로 옳은 것은?", options: ["자신의 사고와 활동을 '거울처럼 비추어 주는 것'으로, 수학화 과정에서 수준 상승을 가능하게 하는 핵심 정신 활동이다.", "교사가 학생의 시험 점수를 분석하여 등급을 매기는 평가 활동이다.", "공식을 잊어버리지 않기 위해 하루에 열 번씩 반복해서 쓰는 연습이다.", "수학적 정의를 현실 맥락과 분리하여 순수 기호로만 암기하는 과정이다."], ans: 0, exp: "프로이덴탈은 반성을 '거울처럼 비추어 주는 것'으로 정의하며 수준 상승의 핵심 원동력으로 보았습니다." },

                { q: "[3세트] 브루너의 '대담한 가설'이 수학교육 현대화 운동에 미친 영향으로 옳은 것은?", options: ["아동의 발달 단계가 도달하기 전에는 어떤 개념도 가르칠 수 없다는 대기주의를 확산시켰다.", "어떤 교과든지 지적으로 올바른 형식으로 표현하면 어떤 발달 단계의 아동에게도 효과적으로 가르칠 수 있다는 신념을 주었다.", "수학 교육과정에서 함수와 집합 개념을 완전히 삭제하는 근거가 되었다.", "교사 재교육 없이도 교과서만 바꾸면 교육 개혁이 성공한다는 회의론을 불러일으켰다."], ans: 1, exp: "브루너의 대담한 가설은 현대수학의 핵심 개념을 조기에 도입할 수 있다는 이론적 근거가 되어 현대화 운동의 세계적 파급에 결정적 역할을 했습니다." },
                { q: "[3세트] 손다이크의 연합주의와 베르트하이머의 형태심리학이 '문제해결'을 바라보는 관점의 차이로 옳은 것은?", options: ["연합주의는 새로운 상황의 창의적 해결에, 형태주의는 과거 습관의 응용에 관심이 있다.", "연합주의는 과거 경험으로부터 형성된 해결 습관의 응용에, 형태주의는 새로운 상황에 대한 창의적·신기한 해결과 구조 파악에 관심이 있다.", "두 입장 모두 공식의 맹목적 암기를 생산적 사고의 최고 형태로 본다.", "형태주의는 자극과 반응의 기계적 결합 강도를 높이는 것을 문제해결의 본질로 본다."], ans: 1, exp: "연합주의는 과거 경험의 해결 습관 응용에, 형태주의는 전체 구조 파악과 통찰을 통한 창의적 해결에 초점을 맞춥니다." },
                { q: "[3세트] 베르트하이머가 말한 '생산적 사고'가 일어나는 과정에 대한 설명으로 옳지 않은 것은?", options: ["부분의 전체와의 내적인 구조적 관련성이 파악된다.", "부분의 재조직화로 구조의 개선적 변화가 일어난다.", "전체가 의미 있는 간단 명료한 형태(good gestalt)로 바뀌는 순간 통찰이 일어난다.", "시행착오적인 조잡한 사고 과정을 거쳐 공식을 맹목적으로 대입한다."], ans: 3, exp: "생산적 사고는 맹목적 공식 적용이나 시행착오가 아닌, 내적 구조 관련성을 파악해 good Gestalt로 재구조화하는 우아한 사고 과정입니다." },
                { q: "[3세트] 피아제의 균형화 이론에서 교사가 학생에게 '인지적 불균형(갈등 상황)'을 제공해야 하는 이유는?", options: ["학생에게 좌절감을 주어 수학 포기를 유도하기 위해서이다.", "일시적 균형 상태에 있는 학생이 동화와 조절의 균형화 과정을 통해 보다 높은 수준의 균형으로 발달하도록 동기를 부여하기 위해서이다.", "외부 지식을 수정 없이 그대로 머릿속에 복사해 넣기 위해서이다.", "감각운동기 단계로 퇴행시켜 구체물 조작만 반복하게 하기 위해서이다."], ans: 1, exp: "조금 더 복잡한 갈등 상황을 경험하게 함으로써 인지적 불균형을 해소하려는 동화·조절의 균형화 과정을 통해 고차원적 인지로 발달합니다." },
                { q: "[3세트] 브루너의 EIS 이론에서 '상징적 표현'에 대한 설명으로 옳은 것은?", options: ["운동적 반응을 통해 표현하는 것으로 감각운동기에만 나타난다.", "도식이나 그래프, 벤 다이어그램을 이용해 표현하는 양식이다.", "언어 능력의 발달과 함께 나타나며, 순수하게 상징적 표현만을 다루는 것은 형식적 조작기에서 가능하다.", "활동적·영상적 표현을 거치지 않고 처음부터 상징적 표현으로만 가르치는 것이 가장 이상적이다."], ans: 2, exp: "상징적 표현은 구체적 조작기까지는 구체물과 관련되어 가능하며, 순수하게 상징적 표현만을 다루는 것은 형식적 조작기에 가능합니다." },
                { q: "[3세트] 딘즈의 이론이 피아제의 관점에서 비판받는 핵심 이유는 무엇인가?", options: ["구체물 조작 활동을 전혀 허용하지 않고 추상적 기호만 사용했기 때문이다.", "반영적 추상화의 핵심인 '반성'의 과정과 아동 활동의 조정이 부족하고, 놀이 대상의 성질을 추상화하는 '경험적 추상화' 수준에 머물러 있기 때문이다.", "지각적 다양성을 무시하고 오직 한 가지 교구만 사용했기 때문이다.", "자유놀이 단계를 생략하고 형식화 단계부터 시작했기 때문이다."], ans: 1, exp: "딘즈의 개념 학습 원리는 아동 활동의 조정과 반성보다는 놀이 대상 자체의 성질을 추상화하는 경험적 추상화 수준에 머물러 있다는 비판을 받습니다." },
                { q: "[3세트] 스켐프의 '관계적 이해'가 학습자에게 주는 정서적·인지적 장점으로 옳지 않은 것은?", options: ["새로운 과제에 더 잘 적용될 수 있으며 기억하기 쉽다.", "내적 학습 동기를 유발하여 외적인 보상과 벌에 대한 요구가 줄어든다.", "기존 스키마와 새 지식을 연결하여 질적으로 유기적인 스키마를 형성한다.", "선행 지식이 전혀 없어도 단시간 내에 즉각적인 정답 도출 보상을 얻을 수 있다."], ans: 3, exp: "선행 지식이 적고 단시간에 즉각적 보상을 얻을 수 있는 것은 '도구적 이해'의 장점입니다." },
                { q: "[3세트] 스켐프의 지휘 체계 모델에서 '감지기', '비교자', '계획·행동', '피동자'의 작동 원리로 옳은 것은?", options: ["감지기는 목표 상태를 설정하고, 비교자는 외부 환경을 직접 파괴한다.", "감지기는 현재 상태의 정보를 얻어 내적으로 표현하고, 비교자는 현재 상태와 목표 상태를 비교하여 차이를 줄이기 위한 행동 계획을 수립한다.", "델타-1은 스키마를 재구성하는 메타인지 체계이고, 델타-2는 물리적 환경에 직접 반응하는 반사 신경이다.", "목표 상태와 현재 상태가 일치할 때 비교자는 새로운 불균형을 강제로 유발한다."], ans: 1, exp: "감지기가 현재 상태(P) 정보를 얻으면 비교자가 목표 상태(G)와 비교하고, 차이를 줄이기 위해 계획·행동을 통해 피동자에 작용합니다." },
                { q: "[3세트] 비고츠키의 '과학적 개념'과 '자발적 개념'의 상호작용에 대한 설명으로 옳은 것은?", options: ["자발적 개념은 교사의 체계적 강의를 통해 형성되고, 과학적 개념은 일상생활에서 무의식적으로 습득된다.", "과학적 개념의 형식적 교육은 자발적 개념의 구조를 점차적으로 변형시키고 하나의 체계로 체제화하는 데 도움을 준다.", "두 개념은 서로 아무런 영향을 미치지 않고 완전히 독립된 영역으로 존재한다.", "자발적 개념이 이미 완벽한 체계를 갖추고 있으므로 학교의 형식적 교육은 불필요하다."], ans: 1, exp: "학교에서 배우는 체계적인 과학적 개념은 아동의 비체계적인 자발적 개념을 의식화하고 체계화하는 데 도움을 줍니다." },
                { q: "[3세트] 오스벨이 말하는 '논리적 유의미가'와 '잠재적 유의미가'의 구분으로 옳은 것은?", options: ["논리적 유의미가는 학습자 개인의 흥미도를 말하고, 잠재적 유의미가는 교사의 설명 능력을 말한다.", "논리적 유의미가는 학습 과제 자체가 실사성과 구속성을 지녀 인지 구조와 연결될 수 있는 성질이며, 잠재적 유의미가는 특정 학습자가 그 과제를 받아들일 관련 정착 아이디어를 소유하고 있는 상태이다.", "논리적 유의미가는 기계적 암기 과제에 부여되고, 잠재적 유의미가는 무의미 철자 학습에 부여된다.", "두 용어는 완전히 동일한 의미로 구분 없이 사용된다."], ans: 1, exp: "논리적 유의미가는 '과제의 성질(실사성·구속성)', 잠재적 유의미가는 '학습자가 관련 정착 아이디어를 소유한 상태'를 의미합니다." },
                { q: "[3세트] 수학기초론의 '논리주의'에 대한 설명으로 옳은 것은?", options: ["프레게는 수와 산술 법칙을 논리적 용어로 정의하려 했으나 역리가 발견되었고, 러셀은 이를 피하기 위해 유형론을 제안하였다.", "수학적 존재성과 유한 번의 구성 가능성을 동일시하였다.", "수학을 의미 없는 기호들의 게임 체계로 보고 형식적 무모순성만을 추구하였다.", "괴델의 불완전성 정리를 통해 논리주의의 완전성이 최종 증명되었다."], ans: 0, exp: "프레게의 시도에서 역리가 발견되자 러셀이 유형론을 제안했으나 환원공리·선택공리 등 자명하지 않은 공리를 도입해야 하는 한계에 부딪혔습니다." },
                { q: "[3세트] 급진적 구성주의의 '지식의 비객관성 원리'가 교육 현장에 주는 시사점으로 옳은 것은?", options: ["교사는 절대적이고 객관적인 진리를 학생의 머릿속에 정확히 주입해야 한다.", "인식은 주체가 경험 세계를 조직하는 데 도움을 주는 것이므로, 교사는 안내자로서 학생 개개인이 다양한 방식으로 지식을 구성하는 것을 격려해야 한다.", "학생들의 오답이나 독특한 풀이는 객관적 실재에 위배되므로 즉시 교정해야 한다.", "모든 학생은 동일한 언어적 설명을 들으면 똑같은 지식을 구성하게 된다."], ans: 1, exp: "급진적 구성주의는 객관적 실재의 전수가 아니라 개인의 경험 세계 조직과 창조성·개성·다양성을 중시하며 교사를 안내자로 봅니다." },
                { q: "[3세트] 사회적 구성주의에서 객관적 수학 지식이 형성되고 개인에게 습득되는 순환 과정([과정 1]과 [과정 2])에 대한 설명으로 옳지 않은 것은?", options: ["[과정 1]: 개인의 주관적 지식이 공표되어 공적인 비판과 재구성을 거쳐 객관적 지식으로 받아들여진다.", "[과정 1]에서 공표된 수학은 라카토스의 증명과 반박의 논리에 따라 재형식화된다.", "[과정 2]: 사회의 객관적 수학 지식이 언어와 학습을 통해 개인의 내적인 주관적 표상으로 내면화된다.", "[과정 2]에서는 언어와 같은 사회적 표현의 매개 없이 개인의 감각적 직관만으로 내면화가 이루어진다."], ans: 3, exp: "[과정 2]에서 '사회가 개인의 인식에 개입하는 매개물'로서 언어와 같은 사회적 표현이 중요한 역할을 합니다." },
                { q: "[3세트] 라카토스의 '오류주의 수업 모형'에서 교사의 역할로 옳지 않은 것은?", options: ["학생이 증명을 할 때 추측과 증명의 각 단계에 대한 적절한 반례를 준비해 두었다가 제시한다.", "학생 수준에서 반박이 불가능한 완벽한 증명을 단번에 제시해서는 안 된다.", "반박을 유도하기 위해 일부러 터무니없고 엉터리인 증명을 제시해야 한다.", "철저한 교재 연구에 바탕을 둔 지도 과정에 대한 사고 실험을 수행해야 한다."], ans: 2, exp: "교사는 반박이 불가능한 증명을 단번에 제시해서도 안 되며, 반박을 위해 '터무니없는 증명을 제시하여서도 안 됩니다'." },
                { q: "[3세트] 프로이덴탈의 '수평적 수학화'와 '수직적 수학화'에 대한 설명으로 옳은 것은?", options: ["수평적 수학화는 기호의 세계 내에서 정리를 연역하고 일반화하는 활동이다.", "수직적 수학화는 현실 문제를 수학적 기호나 모델로 처음 변환하는 활동이다.", "실험하기, 관찰하기, 분류하기 등의 구체적 활동은 수평적 수학화에 해당하며 수학화 과정에 필수적이다.", "프로이덴탈은 수직적 수학화만 가치 있게 보고 수평적 수학화는 비수학적 활동으로 배제하였다."], ans: 2, exp: "실험, 관찰, 귀납, 분류 등 구체적 활동은 수평적 수학화로서 기호화·형식화(수직적 수학화)와 마찬가지로 수학화 과정에 적합하고 중요합니다." },
                { q: "[3세트] 프로이덴탈의 '바닥 수준'과 '탐구 수준'에 대한 설명으로 옳은 것은?", options: ["바닥 수준에서의 활동은 비수학적인 활동이므로 수업에서 철저히 배제해야 한다.", "바닥 수준에서의 활동은 탐구 수준에서의 수학적 활동을 준비하는 예비수학적 활동으로 파악해야 한다.", "탐구 수준에서 바닥 수준으로 내려가는 하향식 연역 지도를 권장한다.", "바닥 수준에서 탐구 수준으로의 상승은 교사의 일방적 강의만으로 이루어진다."], ans: 1, exp: "바닥 수준에서의 활동은 탐구 수준의 수학적 활동을 준비하는 '예비수학적 활동'으로서 점진적 수학화의 출발점이 됩니다." },
                { q: "[3세트] 반 힐레의 기하 수준 이론에 비추어 볼 때, 중학교 기하에서 형식적 증명을 도입하기 전에 선행되어야 할 필수 조건은?", options: ["제1수준의 시각적 모양 판별만 정확히 하면 곧바로 제4수준의 공리적 증명을 가르칠 수 있다.", "제3수준에서의 도형 성질 간 관계망 구축과 국소적 연역 추론 활동이 충분히 선행되어야 한다.", "제5수준의 비유클리드 기하 공리 체계를 먼저 암기시켜야 한다.", "나이가 만 14세가 되면 별도의 학습 없이도 자연스럽게 제4수준에 도달한다."], ans: 1, exp: "관계망 없는 추론은 불가능하므로, 제3수준에서의 관계망 구축은 제4수준의 형식적 연역 추론의 필연적 전제 조건입니다." },
                { q: "[3세트] 반 힐레의 교수·학습 5단계 중 마지막 '통합 단계(5단계)'에서 교사가 유의해야 할 사항은?", options: ["학생들의 사고를 자극하기 위해 전혀 새롭고 낯선 고난도 아이디어를 대거 투입한다.", "전혀 새롭거나 자연스럽지 못한 아이디어를 내놓지 않도록 주의하며, 학생이 이전 활동을 반성하고 전체적 개관을 정리하도록 돕는다.", "교사의 개입을 완전히 중단하고 단일 단계의 단순 반복 과제만 부여한다.", "학생의 선행지식을 진단하기 위한 초기 질의응답을 처음으로 시작한다."], ans: 1, exp: "5단계(통합)에서는 새롭거나 부자연스러운 아이디어를 내놓지 않도록 주의하며, 이전 활동을 반성·요약하여 전체적 개관을 형성하도록 돕습니다." },
                { q: "[3세트] 폴리아의 문제해결 4단계 중 '해결 계획 단계'에서 주어진 것과 구하려는 것 사이의 관련성을 즉각 발견할 수 없을 때 취해야 할 핵심 전략은?", options: ["문제를 포기하고 다음 문제로 넘어간다.", "보조문제를 고려하거나, 정의로 되돌아가고, 조건의 일부를 변형해 본다.", "계산 실수가 없는지 검산부터 실시한다.", "답안지에 풀이 과정을 깨끗하게 청서한다."], ans: 1, exp: "관련성을 즉시 찾을 수 없을 때는 보조문제 고려, 유사 문제 회상, 정의로 돌아가기, 문제의 변형(일반화·특수화) 등을 활용합니다." },
                { q: "[3세트] 쇤펠드(Schoenfeld)가 지적한 '학생들이 문제를 풀 수 있는 수학적 지식(자원)을 가지고 있으면서도 문제해결에 실패하는 주된 이유'는?", options: ["계산 속도가 느리기 때문이다.", "자원과 전략을 적절히 선택·감시·평가하는 '통제(메타인지)' 능력이 부족하기 때문이다.", "공식을 너무 많이 암기했기 때문이다.", "교과서의 활자가 너무 작기 때문이다."], ans: 1, exp: "무엇을 얼마만큼 아느냐(자원)보다 그것을 언제 어떻게 이용할 것인가를 결정하는 '통제(메타인지)' 능력이 문제해결의 성패를 좌우합니다." },
                { q: "[3세트] 수학적 모델링이 일반적인 순수 수학 문제해결과 차별화되는 가장 본질적인 특징은?", options: ["비수학적(현실) 문제 상황에서 출발하여 수학적 표상과 구조를 세우고, 결과를 다시 현실에 맞게 해석·검증한다는 점이다.", "항상 정답이 유일하게 하나로 정해져 있다는 점이다.", "어떠한 가정이나 단순화 과정도 허용되지 않는다는 점이다.", "수학적 계산 단계가 전혀 포함되지 않는다는 점이다."], ans: 0, exp: "수학적 모델링은 '비수학적 문제 상황'에서 출발해 수학화하고, 수학적 결과를 다시 현실 맥락에서 해석·검증하는 순환 과정을 거칩니다." },
                { q: "[3세트] 브루소의 '딘즈 효과(Dienes effect)'가 발생하는 원인으로 옳은 것은?", options: ["학생이 교사의 힌트를 무시하고 혼자 문제를 해결했을 때 발생한다.", "교사가 수업 상황에서 자신이 수행해야 할 교수학적 계약(의무)을 이행하지 않아 학생의 학습이 적절히 이루어지지 않을 때 발생한다.", "교사가 너무 많은 칭찬을 해주어 학생의 내적 동기가 폭발할 때 발생한다.", "학생이 구체물 교구에만 집착하여 추상화를 거부할 때 발생한다."], ans: 1, exp: "브루소는 교사에 의해 교수학적 계약이 이행되지 않아 학생 학습이 제대로 이루어지지 않는 상황을 '딘즈 효과'라 명명했습니다." },
                { q: "[3세트] 쉐발라드의 '개인화/배경화'와 '탈개인화/탈배경화'에 대한 설명으로 옳은 것은?", options: ["수학자는 연구 과정에서 먼저 탈개인화된 논문 형태로 사고한 뒤 나중에 개인화한다.", "수학자는 특정 배경 속에서 개인화/배경화하여 지식을 발견한 뒤, 발표할 때는 개인적 과정을 숨기고 탈개인화/탈배경화하여 형식적으로 표현한다.", "교사는 학생에게 탈개인화된 형식적 지식만을 그대로 전달해야 한다.", "개인화/배경화는 지식을 파손시키는 해로운 과정이므로 금지해야 한다."], ans: 1, exp: "최초 사고자는 개인화/배경화로 이해한 뒤 탈개인화/탈배경화하여 정돈된 지식으로 표현하며, 교사는 이를 다시 학생에 맞게 개인화/배경화(재맥락화)하여 가르쳐야 합니다." },
                { q: "[3세트] 다음 교실 상황에 나타난 극단적 교수 현상은 무엇인가?\n'교사가 학생들에게 기하 교구를 나누어 주었더니, 학생들이 도형의 성질 탐구는 잊어버리고 교구를 예쁘게 조립하고 색깔을 맞추는 활동에만 몰두하였다.'", options: ["메타-인지 이동", "형식적 고착", "토파즈식 외면치레", "조르단식 외면치레"], ans: 0, exp: "개인화/배경화를 돕기 위해 도입한 교수학적 보조 수단(교구)에 학생과 교사의 사고가 쏠려 본래의 수학적 지식에서 멀어지는 현상은 '메타-인지 이동'입니다." },
                { q: "[3세트] 다음 교실 상황에 나타난 극단적 교수 현상은 무엇인가?\n'학생이 2x + 3 = 7을 풀지 못하자 교사가 점점 힌트를 주다가 결국 \"x에 2를 넣으면 2×2+3=7이 되니 x는 얼마지?\"라고 물어 학생이 \"2요\"라고 답하게 한 뒤 진도를 넘어갔다.'", options: ["메타-인지 이동", "형식적 고착", "토파즈식 외면치레", "조르단식 외면치레"], ans: 2, exp: "교사가 가르쳐야 한다는 압박감에 과도한 힌트로 정답을 유도하여 학생이 스스로 학습할 기회를 제거하는 현상은 '토파즈식 외면치레'입니다." },
                { q: "[3세트] 자연수 학습 시 형성된 '곱하면 항상 수가 커진다'는 개념이 소수나 분수의 곱셈(예: 4 × 0.5 = 2)을 학습할 때 방해가 되는 현상을 브루소의 용어로 무엇이라 하는가?", options: ["인식론적 장애", "교수학적 계약", "제도화 상황", "반성적 추상화"], ans: 0, exp: "특정 맥락(자연수)에서는 유용했으나 확장된 맥락(유리수/실수)에서 부적합해지며 학습을 방해하는 지식은 '인식론적 장애'입니다." },
                { q: "[3세트] '총체적 점수화 방법'의 장단점에 대한 설명으로 옳지 않은 것은?", options: ["학생들의 답안에 대해 비교적 신속하게 경제적으로 평가할 수 있다.", "수행 과정을 전체적으로 조망하고 성취도를 등급이나 순위로 분류할 때 유용하다.", "학생의 특정한 장점이나 단점을 날카롭게 지적하여 상세한 교정 피드백을 제공하기 어렵다.", "채점자 간의 평점 차이를 최소화하고 문항 내 각 단계별 점수를 객관적으로 산출하는 데 가장 적합하다."], ans: 3, exp: "단계별 점수를 부여하여 채점자 간 평점 차를 줄이고 객관성을 유지하는 것은 '분석적 점수화 방법'의 장점입니다." },
                { q: "[3세트] 프로젝트 평가의 특징으로 옳지 않은 것은?", options: ["개방형 문제(열린 반응)를 다루므로 문제해결자의 관점에 따라 다양한 답이 나올 수 있다.", "특수한 상황에서 개인의 깊이 있는 탐구를 가능케 하여 주제 및 진행 과정을 개별화·차별화할 수 있다.", "소그룹 협동 학습과 학급 전체 발표(말하기·쓰기)를 통해 의사소통 능력을 신장시킨다.", "판에 박힌 정형화된 계산 문제를 제한 시간 내에 빠르게 풀도록 하는 데 목적이 있다."], ans: 3, exp: "프로젝트 개발 시에는 판에 박힌 정형 문제를 지양하고 참신하고 열린 반응을 요구하는 주제를 개발해야 합니다." },
                { q: "[3세트] 공학적 도구 활용 시의 유의점으로 옳지 않은 것은?", options: ["컴퓨터 환경에서의 구체적·시사적 활동이 피타고라스 정리의 형식적 증명과 같은 본래의 교수 목적과 연결되도록 해야 한다.", "수업의 어느 단계에서 공학적 도구를 활용하고 어느 단계에서 차단할 것인지 세밀하게 계획해야 한다.", "컴퓨터가 수를 소수로 처리하므로 학교수학에서도 분수 지도를 폐지하고 소수 중심으로 재편해야 한다.", "공학적 도구를 적극적으로 활용할 수 있는 제도적이고 현실적인 여건이 마련되어야 한다."], ans: 2, exp: "컴퓨터가 소수나 이산수학을 주로 다룬다고 해서 학교수학의 분수나 연속수학을 폐지하자는 극단적 주장은 공학적 도구의 교육적 한계를 간과한 오류입니다." }

                { q: "[4세트] 수학교육 근대화 운동(19세기 말~20세기 초)과 현대화 운동(1950~60년대)을 비교한 설명으로 옳은 것은?", options: ["근대화 운동은 논리적 엄밀성을 극단적으로 추구했고, 현대화 운동은 논리를 불신하였다.", "근대화 운동은 수학의 실용성과 직관·실험을 강조했고, 현대화 운동은 대수적 구조와 논리적 엄밀성을 강조하였다.", "두 운동 모두 유클리드 원론의 공리적 체계를 중등학교의 핵심 교재로 삼았다.", "근대화 운동은 브루너가 주도했고, 현대화 운동은 페리와 클라인이 주도하였다."], ans: 1, exp: "근대화 운동은 실용성과 직관·실험을 강조해 논리 소홀의 한계를 보였고, 현대화 운동은 반대로 조급한 추상화와 논리적 엄밀성을 강조해 비판을 받았습니다." },
                { q: "[4세트] 클라인(Klein)의 '메란(Meran) 교육과정'의 특징으로 옳은 것은?", options: ["영국 노동자 계급을 위한 실용 측량 교육과정이다.", "독일 김나지움(문화고등학교)의 수학교수 요목으로, 교과서에 함수 개념이 처음으로 도입되었다.", "미국 중등학교에서 대수·기하·물리를 통합하기 위해 만든 실험실법 지침서이다.", "집합론과 군·환·체를 초등학교 1학년부터 가르치기 위한 새수학 교육과정이다."], ans: 1, exp: "클라인이 현장 교사들과 작성한 독일 김나지움의 메란 교육과정에서는 교과서에 함수 개념이 처음으로 도입되었습니다." },
                { q: "[4세트] 손다이크의 연합주의와 카토나의 형태주의(유의미 학습)의 대조로 옳지 않은 것은?", options: ["손다이크는 자극-반응의 결합과 반복 연습을 통한 습관 형성을 중시하였다.", "카토나는 정보의 내적 규칙성과 구조를 파악하여 재조직화하는 유의미 학습을 중시하였다.", "손다이크는 이해 없는 기계적 암기보다 구조적 통찰이 전이에 훨씬 유리하다고 보았다.", "카토나의 실험에서 규칙성을 스스로 발견한 집단은 오랜 시간 후에도 답을 재구성할 수 있었다."], ans: 2, exp: "구조적 통찰과 재조직화를 통한 전이를 강조한 것은 형태심리학자(베르트하이머, 카토나)이며, 손다이크는 모방과 연습을 통한 결합 강화를 중시했습니다." },
                { q: "[4세트] 피아제의 세 가지 추상화 유형을 사례와 바르게 연결한 것은?", options: ["빨간 공과 파란 공을 만져보며 둥글다는 성질을 이끌어냄 - 반영적 추상화", "바둑돌을 3개씩 4묶음으로 묶어 세는 행동을 조정하여 곱셈의 교환법칙을 구성함 - 반영적 추상화", "주사위를 굴려 눈의 수를 확인하며 확률의 공리 체계를 연역함 - 경험적 추상화", "행동을 내면화하여 사고의 대상으로 삼는 주제화 과정 - 의사 경험적 추상화"], ans: 1, exp: "둥글다는 물리적 성질은 경험적 추상화, 묶어 세는 행동의 일반적 조정으로부터의 구성은 반영적 추상화입니다." },
                { q: "[4세트] 피아제(Piaget)와 브루너(Bruner)의 인지 발달 및 학습 이론 비교로 옳은 것은?", options: ["피아제는 상징적 표상이 감각운동기부터 지배적이라고 보았다.", "브루너는 EIS 세 가지 표현 양식을 통해 어떤 수학적 지식도 아동의 수준에 맞게 가르칠 수 있다고 가정하였다.", "피아제는 교사의 언어적 설명이 조작 활동보다 우선해야 한다고 보았다.", "브루너는 지식의 구조보다 잡다한 개별 사실의 암기가 기억에 유리하다고 보았다."], ans: 1, exp: "브루너는 EIS 세 가지 표현 양식을 통해 어떤 교과 내용도 아동의 수준에 알맞게 번역하여 지도할 수 있다고 보았습니다." },
                { q: "[4세트] 딘즈(Dienes)의 놀이 3단계(역동적 원리)의 순서와 각 단계의 특징으로 옳은 것은?", options: ["예비놀이(목표가 불분명하며 그 자체로 즐김) → 구조화된 놀이(목적 지향적이나 명확한 인식은 없음) → 실습놀이(형성된 개념을 고정·적용)", "실습놀이 → 예비놀이 → 구조화된 놀이", "구조화된 놀이 → 자유놀이 → 형식화 놀이", "예비놀이(엄격한 기호 연산) → 실습놀이(규칙 탐색) → 구조화된 놀이(무목적 탐색)"], ans: 0, exp: "역동적 원리의 놀이 3단계는 예비놀이 → 구조화된 놀이 → 실습놀이 순입니다." },
                { q: "[4세트] 스켐프(Skemp)의 '직관적 지능'과 '반영적 지능'에 대한 설명으로 옳지 않은 것은?", options: ["직관적 지능은 시각·청각 등 수용기를 통해 얻은 자료가 개념 구조에 의해 자동적으로 분류·연결된다.", "직관적 지능은 '중재 사고 활동'을 거치지 않고 이루어진다.", "반영적 지능에서는 중재 사고 활동 자체가 자기 반성적 인식의 대상이 된다.", "반영적 지능은 외부 환경에서만 정보의 근거를 찾으며 자신의 스키마를 점검하지 않는다."], ans: 3, exp: "반영적 지능에서는 이유나 근거에 답하기 위해 외부 환경이 아니라 '자신의 개념 체계(스키마)'에서 정보를 찾고 반성합니다." },
                { q: "[4세트] 스켐프의 개념 학습 두 가지 원리 중 둘째 원리가 주는 교수학적 시사점으로 옳은 것은?", options: ["선행 개념이 형성되어 있지 않더라도 상위 개념의 정의만 외우면 추상화가 가능하다.", "연속적으로 추상되는 구조에서 특정 단계를 이해하지 못하면 그 이후의 추상화 과정은 위태롭게 된다.", "새로운 추상 단계에 들어갈 때는 기존의 선행 개념을 모두 잊어버려야 간섭이 없다.", "상위 차원의 개념은 적절한 예시 없이 언어적 정의만으로 의사소통하는 것이 가장 좋다."], ans: 1, exp: "스켐프는 특정 단계를 이해하지 못하면 이후 추상화 과정이 위태로워지므로, 매번 모든 선행 개념이 사용 가능한 상태여야 함을 강조했습니다." },
                { q: "[4세트] 비고츠키의 근접발달영역(ZPD)이 피아제나 브루너의 이론과 구별되는 가장 독특한 특징은?", options: ["아동의 현재 발달 수준에만 초점을 맞추고 미래의 가능성은 배제한다.", "현재 수준의 아동이 유능한 타인의 도움을 받아 '어디까지 발달할 수 있는가(잠재적 발달 수준)'라는 한계 수준에 관심을 기울인다.", "아동의 능동적 활동을 부정하고 수동적 암기만을 강조한다.", "생물학적 성숙이 완료된 이후에만 교수·학습이 의미를 가진다고 본다."], ans: 1, exp: "피아제(현재 수준에 불균형 유발)나 브루너(궁극적 상징 도달)와 달리, 비고츠키는 아동이 단기간에 도달할 수 있는 '잠재적 발달 수준'에 주목했습니다." },
                { q: "[4세트] 오스벨의 '선행조직자(Advance Organizer)'에 대한 설명으로 옳은 것은?", options: ["본 학습 내용보다 훨씬 구체적이고 지엽적인 연습 문제 모음집이다.", "구체적인 학습 과제와 잘 연계되면서 동시에 학습자 내면의 일반적인 정착 아이디어와도 관련 가능하도록 돕는 도입 자료이다.", "본 학습이 모두 끝난 후 평가 단계에서 실시하는 총괄평가 시험지이다.", "학습자의 인지 구조와 전혀 무관한 낯선 주제를 제시하여 인지적 갈등을 극대화하는 장치이다."], ans: 1, exp: "선행조직자는 본 학습 전에 제시되어 학습자의 일반적 정착 아이디어와 구체적 학습 과제를 연결해 주는 다리 역할을 합니다." },
                { q: "[4세트] 절대주의 수리철학(논리주의, 직관주의, 형식주의)의 공통적인 관점으로 옳은 것은?", options: ["수학적 지식은 사회적 합의에 의해 언제든 바뀔 수 있는 오류 가능한 추측이다.", "수학적 지식은 절대적으로 확실한 진리라고 보며, 수학적 진리의 안전한 기초를 확립하는 데 관심이 있다.", "수학은 자연과학과 동일한 경험적 실험 방법에 의해 검증된다.", "수학적 명제의 참과 거짓은 개인의 주관적 유용성에 따라 달라진다."], ans: 1, exp: "논리주의, 직관주의, 형식주의는 모두 수학적 지식을 절대적 진리로 보는 '절대주의 수리철학'의 기초론 학파들입니다." },
                { q: "[4세트] 급진적 구성주의의 3가지 원리가 바르게 짝지어진 것은?", options: ["지식의 자주적 구성의 원리 - 지식의 생장 지향성의 원리 - 지식의 비객관성의 원리", "지식의 수동적 수용의 원리 - 지식의 절대적 객관성의 원리 - 언어의 투명성 원리", "지식의 사회적 합의의 원리 - 논리적 환원의 원리 - 공리적 완전성의 원리", "지식의 경험적 모방의 원리 - 자극-반응 결합의 원리 - 반교수학적 전도의 원리"], ans: 0, exp: "급진적 구성주의 3원리는 ① 자주적 구성, ② 생장 지향성(적합성), ③ 비객관성의 원리입니다." },
                { q: "[4세트] 라카토스가 유클리드 원론과 같은 연역적 체계의 서술 방식을 비판하며 제시한 개념 발생의 관점은?", options: ["정의는 항상 정리나 증명에 앞서 선험적으로 완벽하게 주어져야 한다.", "처음에는 미처 인식되지 않았던 개념이나 정의가 반례 출현 이후의 증명 분석 과정에서 새롭게 인식되거나 생겨난다(증명 생성 개념).", "반례가 나타나면 증명을 수정하지 말고 반례를 발견한 학생을 제재해야 한다.", "수학은 반박이 불가능한 단조 증가적 지식의 축적으로만 발전한다."], ans: 1, exp: "유클리드 원론은 정의를 먼저 제시하지만, 실제 수학사에서는 반례 출현 후 증명 분석 과정에서 새로운 개념(증명 생성 개념)이 탄생합니다." },
                { q: "[4세트] 인간 활동으로서의 수학을 강조한 학자들과 그들이 사용한 용어의 연결이 옳은 것은?", options: ["폴리아 - 기성수학 / 라카토스 - 절대적 수학 / 프로이덴탈 - 완성된 수학", "폴리아 - 발생 상태로서의 수학 / 라카토스 - 비형식적 수학 / 프로이덴탈 - 실행수학", "폴리아 - 공리적 수학 / 라카토스 - 형식적 수학 / 프로이덴탈 - 반교수학적 수학", "폴리아 - 소비자 수학 / 라카토스 - 새수학 / 프로이덴탈 - 실험실 수학"], ans: 1, exp: "발생 상태로서의 수학(폴리아), 비형식적 수학(라카토스), 실행수학(프로이덴탈) 모두 과정과 활동을 중시하는 용어입니다." },
                { q: "[4세트] 프로이덴탈의 '안내된 재발명(Guided Reinvention)'에 대한 설명으로 옳지 않은 것은?", options: ["학생들이 교사의 안내 하에 감정이 이입될 수 있는 현실로부터 수학화 활동을 통해 주관적 의미를 갖는 수학을 재발명하는 것이다.", "교사의 안내를 완전히 배제한 채 학생 혼자 수천 년의 수학사를 맨땅에서 재발명하게 하는 방임주의이다.", "연역적 체계를 처음부터 부과하는 반교수학적 전도를 극복하기 위한 교수학적 원리이다.", "수학의 형식화는 학습의 출발점이 아니라 수학화 활동의 결과로서 나중에 이루어진다."], ans: 1, exp: "안내된 재발명은 방임이 아니라 교사의 적절한 '안내(사고 실험에 기반한 조력)' 하에 학생이 주관적 의미를 구성하며 재발명하는 과정입니다." },
                { q: "[4세트] 반 힐레의 기하 사고 수준에서 '필요조건과 충분조건을 구분하고, 사각형의 포함 관계를 위계적으로 분류하며, 삼각형 내각의 합(180°)을 이용해 사각형 내각의 합(360°)을 이끌어내는 수준'은?", options: ["제1수준 (시각적 인식 수준)", "제2수준 (기술적/분석적 인식 수준)", "제3수준 (관계적/추상적 인식 수준)", "제4수준 (형식적 연역 수준)"], ans: 2, exp: "필요·충분조건 구분, 도형의 위계적 분류, 국소적(소규모) 연역 추론은 모두 제3수준(관계적/추상적 수준)의 특징입니다." },
                { q: "[4세트] 반 힐레의 교수·학습 5단계 중 '단일 단계의 과제를 통해 학생이 탐구 분야의 구조를 점진적으로 파악하는 2단계'와 '다중 단계의 개방적 문제해결 과제에 도전하는 4단계'의 명칭이 바르게 연결된 것은?", options: ["2단계: 안내된 탐구 / 4단계: 자유 탐구", "2단계: 질의/안내 / 4단계: 발전/명료화", "2단계: 자유 탐구 / 4단계: 통합", "2단계: 발전/명료화 / 4단계: 안내된 탐구"], ans: 0, exp: "2단계(안내된 탐구)에서는 단일 단계의 계열화된 과제를 다루고, 4단계(자유 탐구)에서는 다중 단계의 복잡한 문제해결 과제에 도전합니다." },
                { q: "[4세트] 폴리아(Polya)의 문제제기(Problem Posing)에 대한 견해로 옳지 않은 것은?", options: ["문제를 제기하는 것은 수학을 창조하는 결정적인 사고 단계이다.", "해결 계획 단계에서 조건이나 자료를 변형해 보조 문제를 작성하는 것은 중요한 문제해결 전략이다.", "어떤 문제를 푸는 데 성공하고 나면 반드시 반성 단계에서 미지인 것과 조건을 바꾸거나 일반화·특수화하여 새로운 문제를 찾아보아야 한다.", "문제를 푸는 능력만 중요하므로 학생이 스스로 문제를 고안해 보는 경험은 불필요하다."], ans: 3, exp: "폴리아는 학생의 수학적 사고 경험은 '혼자 고안한 문제를 풀어볼 기회가 없었다면 불완전하다'고 강조했습니다." },
                { q: "[4세트] 문제제기의 교육적 역할과 중요성에 대한 설명으로 옳지 않은 것은?", options: ["창의적 능력의 발현과 탐구 지향적인 학습 태도를 길러 준다.", "학생들의 수학에 대한 이해 정도를 파악할 수 있는 진단 수단이 된다.", "오직 최상위권 영재 학생들에게만 적합하며 학력 수준이 낮은 학생들에게는 무의미하다.", "이미 배운 지식을 종합적으로 이용할 기회를 제공하고 수학에 대한 긍정적 성향을 함양한다."], ans: 2, exp: "문제제기는 학력 수준이 낮은 학생들에게도 자신의 수준에 맞는 문제를 만들고 해결하는 의미 있는 수학 학습 활동을 제공합니다." },
                { q: "[4세트] 브라운과 월터의 'What-if-not' 전략 적용 예시로 가장 적절한 것은?", options: ["피타고라스 정리 a²+b²=c²의 조건 중 '직각삼각형이다'라는 속성을 부정하여 '만약 직각삼각형이 아니라면 어떻게 될까?'라는 의문으로 코사인 법칙을 탐구한다.", "교과서에 나온 증명 과정을 토씨 하나 틀리지 않고 백지에 그대로 옮겨 적는다.", "주어진 이차방정식의 근의 공식에 숫자를 대입해 10문제를 반복해서 푼다.", "모눈종이 위에 그려진 직사각형의 가로와 세로 길이를 자로 정확히 측정한다."], ans: 0, exp: "기존 문제나 정리의 핵심 속성을 열거한 뒤 그 속성을 부정('만약 그렇지 않다면?')하여 새로운 문제를 설정하는 것이 What-if-not 전략입니다." },
                { q: "[4세트] 브루소의 '교수학적 상황'과 '비교수학적 상황'의 관계로 옳은 것은?", options: ["교수학적 상황은 교사의 의도가 완전히 제거된 상태이고, 비교수학적 상황은 교사가 일방적으로 강의하는 상태이다.", "비교수학적 상황은 교수학적 의도가 감추어져 학생 스스로 수학적 지식을 문제 해결의 도구로 활용하는 상황이며, 이를 위해 '책임의 양도'가 선행되어야 한다.", "교수학적 계약이 파기되면 비교수학적 상황이 저절로 완성된다.", "제도화 단계가 끝난 후 행동 단계로 되돌아가는 것을 책임의 양도라 한다."], ans: 1, exp: "교사가 학습 책임을 학생에게 넘기는 '책임의 양도'를 통해 교수학적 의도가 감추어진 '비교수학적 상황'으로 전환됩니다." },
                { q: "[4세트] 다음 교실 상황에 나타난 극단적 교수 현상은 무엇인가?\n'학생이 무리수 √2 + √3을 √5라고 잘못 계산한 뒤 우연히 다른 문제에서 2와 3을 더해 5라고 답한 것을 보고, 교사가 \"역시 너는 제곱근의 덧셈 원리를 완벽히 이해했구나!\"라고 칭찬하며 넘어갔다.'", options: ["메타-인지 이동", "형식적 고착", "토파즈식 외면치레", "조르단식 외면치레"], ans: 3, exp: "탈배경화/탈개인화 측면을 간과하여 학생의 사소하거나 우연한 행동을 보고 특정 수학 지식을 형성했다고 과대평가하여 잘못 판단하는 현상은 '조르단식 외면치레'입니다." },
                { q: "[4세트] 다음 교실 상황에 나타난 극단적 교수 현상은 무엇인가?\n'이차방정식의 근의 공식이 유도되는 원리나 의미는 전혀 다루지 않고, 오직 공식의 기계적 암기와 대입 계산 문제 100문제만 반복 연습시켰다.'", options: ["메타-인지 이동", "형식적 고착", "토파즈식 외면치레", "조르단식 외면치레"], ans: 1, exp: "개인화/배경화 과정을 무시하고 일반화된 공식의 형식적 연습에만 의존하게 하는 현상은 '형식적 고착'입니다." },
                { q: "[4세트] 서술형 문항 채점 시 '가채점'을 실시하는 주된 목적은?", options: ["전체 학생의 성적을 미리 산출하여 석차를 확정하기 위해서이다.", "채점 기준의 요소 중 채점자가 미처 생각하지 못한 요소나 부적절하게 배당된 점수가 있는지 검토하고 보완·수정하기 위해서이다.", "모범답안을 폐기하고 학생들의 오답을 정답으로 인정하기 위해서이다.", "채점 시간을 단축하기 위해 일부 학생만 채점하고 나머지는 추첨으로 점수를 주기 위해서이다."], ans: 1, exp: "가채점은 실제 학생 답안 일부를 채점해 봄으로써 채점 기준표의 누락된 요소나 부적절한 배점을 사전에 수정·보완하기 위해 실시합니다." },
                { q: "[4세트] '분석적 점수화 방법' 사용 시 주의할 점으로 옳은 것은?", options: ["특정 요소에 대한 채점 결과가 다른 요소에 대한 채점 결과에 영향을 주어서는 안 되며, 채점 요소를 너무 세분화하지 않도록 한다.", "풀이 과정 전체의 인상을 보고 하나의 총점만 부여해야 한다.", "첫 단계에서 계산 실수를 하면 이후 논리가 모두 맞더라도 무조건 0점 처리한다.", "채점 기준표를 사전에 작성하지 않고 채점자의 직관에 따라 유동적으로 점수를 준다."], ans: 0, exp: "분석적 점수화에서는 요소 간 독립성을 유지해 한 요소의 결과가 다른 요소에 영향을 주지 않아야 하며, 과도한 세분화를 피해야 합니다." },
                { q: "[4세트] 관찰 및 면담 평가에서 '관찰 시 유의점'으로 옳지 않은 것은?", options: ["뚜렷한 관찰 목적 또는 문제의식을 가지고 관찰에 임한다.", "부분과 전체의 관련을 지으며 관찰함으로써 피상적인 관찰이 되지 않도록 한다.", "객관적인 태도로 관찰하며, 관찰 기간의 길이는 짧게 하고 누적시키는 방법을 쓴다.", "한 번에 장시간 동안 모든 학생의 모든 행동을 주관적 감정에 따라 기록한다."], ans: 3, exp: "관찰은 뚜렷한 목적과 치밀한 계획을 세워 객관적으로 수행하되, 관찰 기간은 짧게 하고 누적시키는 방법을 사용해야 합니다." },
                { q: "[4세트] 관찰 및 면담 기록법 중 '일화기록법'과 '체크리스트/평정척도법'의 비교로 옳은 것은?", options: ["일화기록법은 사전 준비가 많이 들지만 사후 분석 시간이 전혀 필요 없다.", "체크리스트는 예기치 않은 돌발 행동을 기록하기에 가장 적합하다.", "일화기록법은 별다른 준비 없이 예기치 않은 행동을 포착해 기록할 수 있으나 기록 내용을 해석·분석하는 데 별도의 시간과 노력이 든다.", "평정척도법은 구체적인 행동 사례를 서술형 일기 형식으로 길게 적는 방법이다."], ans: 2, exp: "일화기록법은 즉각적 메모와 돌발 행동 포착이 쉬우나 사후 분석에 시간이 걸리고, 체크리스트는 사전 제작에 시간이 걸리나 사후 활용이 수월합니다." },
                { q: "[4세트] 포트폴리오 평가의 이점 및 의의로 옳지 않은 것은?", options: ["학생 스스로 자신의 변화 과정과 장점·약점·성실성·잠재 가능성을 인식할 수 있다.", "교사는 학생의 과거와 현재 상태를 파악하고 앞으로의 발전 방향에 대해 조언할 수 있다.", "교사·학생·학부모 간의 훌륭한 의사소통 수단이 된다.", "단일 지필고사의 점수만으로 학생의 서열을 빠르게 매기는 데 가장 최적화된 도구이다."], ans: 3, exp: "포트폴리오는 단일 시험 점수 의존에서 벗어나 다양한 원천을 토대로 학습자를 총체적·질적으로 평가하는 방법입니다." },
                { q: "[4세트] 공학적 도구가 '다양한 표현 체계의 연결'에 기여하는 바를 가장 잘 설명한 것은?", options: ["대수식, 표, 함수의 그래프 등 수학의 다양한 표현을 한 화면에 동시에 제공하여 표현 간 연결과 함수의 공통 특징 탐구를 돕는다.", "학생들이 손으로 그래프를 그리는 능력을 완전히 퇴화시켜 모든 표현을 기호로만 제한한다.", "오직 3차원 입체도형의 회전 기능만 제공하여 대수적 식과의 연결을 차단한다.", "연산 속도를 늦추어 학생들이 한 문제만 풀도록 유도한다."], ans: 0, exp: "공학적 도구는 대수식, 표, 그래프 등 다양한 표현을 동일 화면에 제시해 학생들이 표현 간 관계를 연결 짓고 의미를 충실히 이해하도록 돕습니다." },
                { q: "[4세트] 다음 중 '학생 주도형' 컴퓨터 활용 양식의 특징으로 옳은 것은?", options: ["전통적 교사의 역할을 컴퓨터가 대신하여 드릴과 연습을 시킨다.", "학생이 논리적인 단계를 구성해 입력함으로써 컴퓨터를 직접 지도(프로그래밍)하고, 거북의 움직임 등을 통해 자신의 사고 과정을 반성한다.", "미적분 계산이나 방정식 풀이를 버튼 한 번으로 대신 해결해 주는 계산기 역할을 한다.", "교사가 미리 녹화한 동영상 강의를 일방적으로 시청하는 양식이다."], ans: 1, exp: "LOGO나 BASIC 등을 활용한 학생 주도형은 학생이 컴퓨터를 프로그램(지도)하고 그 결과를 보며 자신의 사고를 반성하게 합니다." }

            [

                { q: "[5세트] 수학교육 현대화 운동에 대한 비판으로 옳지 않은 것은?", options: ["학생들의 정신적 발달 단계에 부합하지 않는 조급한 형식화와 추상화를 시도하였다.", "장래 수학자가 되기 위한 소수의 학생을 대상으로 하였다.", "현장 교사들을 위한 재교육과 지원이 지나치게 과도하여 교사들의 자율성을 침해하였다.", "논리적 엄밀성과 연역적 추론이 지나치게 강조되고 타 교과와의 관련성을 무시하였다."], ans: 2, exp: "현대화에 최종 책임을 지는 교사를 위한 적절한 재교육과 지원이 '충분하지 못했다'는 것이 주요 비판점입니다." },
                { q: "[5세트] 1980~90년대 수학교육의 큰 흐름으로 묶인 항목에 해당하지 않는 것은?", options: ["문제해결", "구성주의 및 수학 학습 수준 이론", "현실주의적 수학교육(RME)과 공학적 도구 활용", "유클리드 원론 중심의 엄격한 형식주의 복귀"], ans: 3, exp: "1980~90년대 수학교육의 큰 흐름은 문제해결, 구성주의, 수학 학습 수준 이론, 현실주의적 수학교육(RME), 공학적 도구 활용, 평가 방법 개선입니다." },
                { q: "[5세트] 손다이크의 '효과의 법칙'에 대한 설명으로 옳은 것은?", options: ["자극과 반응 사이의 결합 후 만족스러운 결과가 수반되면 결합 강도가 증대되고, 불만족스러운 결과가 수반되면 결합이 약화된다.", "학습자의 내적 반성과 통찰이 일어날 때만 자극과 반응이 연결된다.", "연습의 횟수나 결과의 만족도와 무관하게 한 번의 경험으로 영구적 학습이 일어난다.", "산술 법칙은 모방이나 연습 없이 연역적 증명을 통해서만 습득된다."], ans: 0, exp: "자극-반응 결합에 따르는 결과의 만족 여부에 따라 결합 강도가 증대되거나 약화된다는 것이 손다이크의 '효과의 법칙'입니다." },
                { q: "[5세트] 베르트하이머의 평행사변형 문제에서 통찰이 일어나는 원리로 언급된 '회임의 원리(Law of Prägnanz)'에 대한 설명으로 옳은 것은?", options: ["전체가 복잡하고 무질서한 형태로 흩어지려는 무의식적 경향이다.", "전체의 구조적 특성에 합치되는 방향으로 부분의 재구조화가 일어나 good Gestalt(간단 명료한 형태)로 향하는 잠재의식적 경향이다.", "과거에 외웠던 공식들을 무작위로 대입해 보는 시행착오 원리이다.", "교사가 정답을 직접 알려줄 때까지 기다리는 수동적 수용 원리이다."], ans: 1, exp: "회임의 원리는 전체의 구조적 특성에 합치되는 방향으로 부분이 재구조화되어 좋은 형태(good Gestalt)로 나아가려는 경향을 뜻합니다." },
                { q: "[5세트] 피아제의 균형화 이론에서 '동화(Assimilation)'와 '조절(Accommodation)'에 대한 설명으로 옳은 것은?", options: ["동화는 기존 도식을 수정·분화하는 혁신적 기능이고, 조절은 기존 도식을 고수하는 보수적 기능이다.", "동화는 기존의 어떤 도식을 고수하면서 가능한 한 넓은 범위의 상황을 그에 종속시키려는 보수적 기능이고, 조절은 당면한 문제를 해결하기 위해 자신의 도식을 조절·분화하는 적응 기능이다.", "동화와 조절은 서로 대립하므로 인지 발달을 위해서는 조절만 일어나고 동화는 배제되어야 한다.", "평형화 상태에서는 동화와 조절이 완전히 소멸한다."], ans: 1, exp: "동화는 기존 인지 구조에 대상을 맞추는 보수적 기능, 조절은 새로운 대상에 맞게 기존 도식을 변형·분화하는 적응 기능입니다." },
                { q: "[5세트] 브루너의 '지식의 구조'에 대한 정의로 가장 정확한 것은?", options: ["각 학문의 기저를 이루고 있는 핵심적인 개념과 원리로서, 단순한 사실이나 잡다한 현상을 서로 관련짓고 체계화하는 주요 개념이나 원리", "교과서 목차에 나열된 단원명과 페이지 번호의 물리적 배열", "학생들이 시험 전날 암기해야 할 공식 요약집", "모든 학문 분야를 하나로 통합한 단일 공리 체계"], ans: 0, exp: "지식의 구조란 학문의 기저를 이루며 잡다한 사실과 현상을 서로 관련짓고 체계화하는 핵심 개념과 원리를 말합니다." },
                { q: "[5세트] 딘즈의 수학 개념 학습 6단계 중 '놀이를 하는 가운데 점차로 어떤 규칙성이 있다는 느낌을 갖게 되는 단계(2단계)'와 '여러 구체물 속에 공통적으로 들어 있는 수학적 구조를 파악하며 규칙성이 명확해지는 단계(3단계)'는?", options: ["2단계: 게임 단계 / 3단계: 공통성 탐구 단계", "2단계: 자유놀이 단계 / 3단계: 표현 단계", "2단계: 공통성 탐구 단계 / 3단계: 기호화 단계", "2단계: 게임 단계 / 3단계: 형식화 단계"], ans: 0, exp: "2단계(게임 단계)에서 규칙성의 느낌을 갖고, 3단계(공통성 탐구 단계)에서 여러 구체물 속 공통된 수학적 구조를 파악합니다." },
                { q: "[5세트] 스켐프가 제시한 '도구적 이해'의 장점과 단점이 바르게 짝지어진 것은?", options: ["장점: 내적 동기 유발 / 단점: 선행 지식이 많이 필요함", "장점: 선행 지식이 적어 빠르고 명확하게 이해하며 즉각적 보상을 얻음 / 단점: 쉽게 잊어버리고 스키마 확장이 어려우며 내적 동기가 유발되지 않음", "장점: 새로운 과제에 전이가 잘 됨 / 단점: 이해하는 데 시간이 너무 오래 걸림", "장점: 유기적 스키마 형성 / 단점: 중·고교 수준을 넘어서는 개념이 많음"], ans: 1, exp: "도구적 이해는 빠르고 즉각적 보상이 있으나, 망각이 쉽고 스키마 확장이 어려우며 내적 동기가 유발되지 않는 단점이 있습니다." },
                { q: "[5세트] 비고츠키의 '비계 설정(Scaffolding)'의 궁극적 목적은 무엇인가?", options: ["학생이 평생 교사의 도움에 의존하여 문제를 풀도록 만드는 것이다.", "근접발달영역 내에서 도움을 적절히 조절해 제공함으로써 학습자의 자기조절능력을 증진시켜 스스로 과제를 해결할 수 있도록 돕는 것이다.", "모든 학생에게 동일한 양의 힌트를 기계적으로 분배하는 것이다.", "학생의 실제적 발달 수준을 낮추어 쉬운 문제만 풀게 하는 것이다."], ans: 1, exp: "비계 설정은 적절한 지원과 점진적 철회를 통해 학습자의 자기조절능력을 키우고 독립적 문제 해결에 이르게 하는 것이 목적입니다." },
                { q: "[5세트] 오스벨의 유의미 학습에서 '포섭(Subsumption)'에 대한 설명으로 옳은 것은?", options: ["인지 구조는 위계적으로 조직되므로, 포괄성과 일반성이 높은 인지 구조 내의 지식이 포괄성과 일반성이 낮은 새로운 지식을 통합하는 과정이다.", "새로운 지식이 기존의 모든 인지 구조를 파괴하고 백지 상태에서 다시 시작하는 과정이다.", "관련 정착 아이디어가 전혀 없는 상태에서 무의미 철자를 기계적으로 반복 암기하는 과정이다.", "학생이 교사의 설명을 거부하고 독자적인 공리 체계를 창조하는 과정이다."], ans: 0, exp: "포섭은 위계적 인지 구조 내에서 포괄성·일반성이 높은 기존 지식이 포괄성·일반성이 낮은 새 지식을 통합하는 과정입니다." },
                { q: "[5세트] 수학기초론의 '직관주의(Intuitionism)'에 대한 설명으로 옳지 않은 것은?", options: ["수학적 지식의 유일한 원천은 근본적인 직관이다.", "수학적 진리는 유한 번의 단계로 구성 가능함을 보임으로써 확립된다고 보았다.", "배중률은 모든 무한집합에도 임의로 적용할 수 있는 절대적으로 자명한 논리 법칙이라고 주장하였다.", "수학적 존재성과 구성 가능성을 같은 것으로 보았다."], ans: 2, exp: "직관주의는 배중률을 무한집합에 임의로 적용할 수 없는 자명하지 않은 논리로 보고, 새로운 진리 발견 도구로 배중률 사용을 거부했습니다." },
                { q: "[5세트] 급진적 구성주의의 언어관에 대한 설명으로 옳은 것은?", options: ["언어는 지식을 전달하는 투명한 수단이므로 교사가 정확히 설명하면 지식이 그대로 전달된다.", "지식은 언어를 통해 전달될 수 없으며, 개별 주체들의 의사소통은 주관적 경험 세계의 상대적 합의 영역이 존재할 때 가능하다.", "언어는 객관적 실재의 본질을 완벽하게 반영한다.", "수학 수업에서 학생들 간의 대화나 토론은 시간 낭비이므로 금지해야 한다."], ans: 1, exp: "급진적 구성주의는 지식이 언어로 전달될 수 없으며 개인의 추상화로 구성된다고 보고, 의사소통은 주관적 경험 세계의 상대적 합의 영역을 통해 가능하다고 봅니다." },
                { q: "[5세트] 라카토스의 '보조정리합체법'이 수리철학적으로 갖는 가장 중요한 의의는?", options: ["발견의 논리와 정당화의 논리가 분리되지 않고 하나로 통합된다는 견해를 제시한 것이다.", "추측을 전혀 수정하지 않고 반례를 영구히 은폐할 수 있음을 보여준 것이다.", "연역적 증명이 불필요함을 입증한 것이다.", "수학적 정의는 절대 변하지 않는 불변의 진리임을 확인한 것이다."], ans: 0, exp: "보조정리합체법은 반례의 원인이 된 보조정리를 찾아 추측에 합체시키고 증명을 고침으로써, 새로운 추측을 발견하는 과정과 증명(정당화)하는 과정이 하나로 통합됨을 보여줍니다." },
                { q: "[5세트] 프로이덴탈의 '수학화(Mathematization)'에 대한 정의로 옳은 것은?", options: ["이미 완성된 기성 수학의 공식을 암기하여 계산 문제에 대입하는 활동이다.", "현상을 수학자의 필요에 맞게 적절히 손질하여 새로운 것, 즉 본질로 조직해 내는 조직화 활동이며, 현상과 본질의 교대 작용에 의해 수준 상승이 이루어지는 불연속적 과정이다.", "현실 세계와 무관한 순수 기호만을 무작위로 배열하는 형식적 게임이다.", "교사가 칠판에 적어준 정리를 학생이 노트에 그대로 베껴 쓰는 활동이다."], ans: 1, exp: "수학화는 현상을 본질로 조직해 내는 활동이며, 현상과 본질의 교대 작용을 통해 수준 상승이 일어나는 불연속적 과정입니다." },

            ]

        // =========================================================================
        // STATE & LOGIC: 앱 상태 관리 및 인터랙션
        // =========================================================================
        let currentMode = 'blank';
        let selectedCategory = 'all';

        // 빵꾸노트 상태
        let totalBlanks = 0;
        let correctBlanks = 0;
        let wrongBlanks = 0;
        let blankRegistry = [];

        // 객관식 상태 (5세트 시스템)
        let currentSetIdx = 0;
        let mcqAnswered = {}; // { qIndex: selectedOptionIndex }

        function switchMode(mode) {
            currentMode = mode;
            const tabBlank = document.getElementById('tab-blank');
            const tabMcq = document.getElementById('tab-mcq');
            const viewBlank = document.getElementById('view-blank');
            const viewMcq = document.getElementById('view-mcq');
            const modeDesc = document.getElementById('mode-desc');

            if (mode === 'blank') {
                tabBlank.className = "px-4 py-2 rounded-lg text-sm font-bold bg-white text-indigo-600 shadow-sm transition";
                tabMcq.className = "px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 transition";
                viewBlank.classList.remove('hidden');
                viewMcq.classList.add('hidden');
                modeDesc.innerHTML = "• 정답을 입력하면 즉시 통과됩니다. <strong>틀린 답을 입력한 상태에서 Enter를 누르거나 다른 곳을 터치하면 즉시 정답이 공개</strong>됩니다.";
                updateBlankProgress();
            } else {
                tabMcq.className = "px-4 py-2 rounded-lg text-sm font-bold bg-white text-indigo-600 shadow-sm transition";
                tabBlank.className = "px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 transition";
                viewMcq.classList.remove('hidden');
                viewBlank.classList.add('hidden');
                modeDesc.innerHTML = `• 새로고침할 때마다 5개 세트(총 150문제) 중 하나가 랜덤 출제됩니다. 현재 <strong>[제 ${currentSetIdx + 1}세트]</strong>를 풀고 있습니다.`;
                updateMCQProgress();
            }
        }

        // -------------------------------------------------------------------------
        // 1. 빵꾸노트 렌더링 및 즉시 채점/오답공개 로직
        // -------------------------------------------------------------------------
        function renderCategoryFilters() {
            const filterContainer = document.getElementById('category-filters');
            let html = `<button onclick="filterCategory('all')" class="cat-btn px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${selectedCategory === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}">전체 영역</button>`;
            
            blankQuizData.forEach(sec => {
                const shortName = sec.category.split(' ')[1];
                const isActive = selectedCategory === sec.id;
                html += `<button onclick="filterCategory('${sec.id}')" class="cat-btn px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${isActive ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}">${shortName}</button>`;
            });
            filterContainer.innerHTML = html;
        }

        function filterCategory(catId) {
            selectedCategory = catId;
            renderCategoryFilters();
            renderBlanks();
        }

        function renderBlanks() {
            const container = document.getElementById('blank-container');
            container.innerHTML = '';
            totalBlanks = 0;
            correctBlanks = 0;
            wrongBlanks = 0;
            blankRegistry = [];

            const filteredData = selectedCategory === 'all' 
                ? blankQuizData 
                : blankQuizData.filter(d => d.id === selectedCategory);

            filteredData.forEach((section, sIdx) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden';

                const header = document.createElement('div');
                header.className = 'bg-slate-50 border-b border-slate-200/80 px-5 py-3.5 flex justify-between items-center';
                header.innerHTML = `<h2 class="text-base sm:text-lg font-bold text-slate-800">${section.category}</h2>`;
                card.appendChild(header);

                const list = document.createElement('ul');
                list.className = 'divide-y divide-slate-100';

                section.items.forEach((sentence, iIdx) => {
                    const li = document.createElement('li');
                    li.className = 'px-5 py-4 hover:bg-slate-50/60 transition';

                    const parsedHTML = sentence.replace(/\[(.*?)\]/g, (match, answerText) => {
                        totalBlanks++;
                        const uid = `blk-${section.id}-${iIdx}-${totalBlanks}`;
                        const widthEm = Math.max(answerText.length * 1.35 + 1.5, 4.5);

                        blankRegistry.push({ id: uid, answer: answerText });

                        return `<input type="text" id="${uid}" 
                                autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                                placeholder="?"
                                class="blank-input"
                                style="width: ${widthEm}em"
                                oninput="handleBlankInput('${uid}', '${answerText}')"
                                onkeydown="handleBlankKeydown(event, '${uid}', '${answerText}')"
                                onblur="handleBlankBlur('${uid}', '${answerText}')">`;
                    });

                    li.innerHTML = `<p class="text-slate-700 leading-8 text-sm sm:text-base break-keep">${parsedHTML}</p>`;
                    list.appendChild(li);
                });

                card.appendChild(list);
                container.appendChild(card);
            });

            updateBlankProgress();
        }

        function normalize(str) {
            // 공백, 하이픈, 가운뎃점 제거 후 소문자화
            return str.replace(/[\s\-·/]/g, '').toLowerCase();
        }

        // 타이핑 도중 정답과 일치하면 즉시 정답 처리
        function handleBlankInput(uid, correctAnswer) {
            const el = document.getElementById(uid);
            if (!el || el.dataset.status) return;

            if (normalize(el.value) === normalize(correctAnswer)) {
                markBlankCorrect(el, correctAnswer, true);
            }
        }

        // Enter 키 입력 시: 정답이면 통과, 틀렸으면 즉시 정답 노출
        function handleBlankKeydown(e, uid, correctAnswer) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const el = document.getElementById(uid);
                if (!el || el.dataset.status) return;

                if (normalize(el.value) === normalize(correctAnswer)) {
                    markBlankCorrect(el, correctAnswer, true);
                } else {
                    markBlankWrong(el, correctAnswer, true);
                }
            }
        }

        // 포커스를 잃었을 때(다른 칸 터치 등): 무언가 입력했는데 틀렸다면 즉시 정답 노출
        function handleBlankBlur(uid, correctAnswer) {
            const el = document.getElementById(uid);
            if (!el || el.dataset.status) return;

            const val = el.value.trim();
            if (val.length === 0) return; // 아무것도 안 적고 넘어간 경우는 보류

            if (normalize(val) === normalize(correctAnswer)) {
                markBlankCorrect(el, correctAnswer, false);
            } else {
                markBlankWrong(el, correctAnswer, false);
            }
        }

        function markBlankCorrect(el, correctAnswer, moveNext) {
            el.value = correctAnswer;
            el.classList.add('correct');
            el.dataset.status = 'correct';
            correctBlanks++;
            updateBlankProgress();
            if (moveNext) focusNextBlank(el.id);
        }

        function markBlankWrong(el, correctAnswer, moveNext) {
            const userTyped = el.value.trim();
            el.value = `${correctAnswer}`;
            el.title = `내가 쓴 답: ${userTyped}`;
            el.classList.add('wrong-revealed');
            el.dataset.status = 'wrong';
            wrongBlanks++;
            updateBlankProgress();
            if (moveNext) focusNextBlank(el.id);
        }

        function focusNextBlank(currentId) {
            const idx = blankRegistry.findIndex(b => b.id === currentId);
            for (let i = idx + 1; i < blankRegistry.length; i++) {
                const nextEl = document.getElementById(blankRegistry[i].id);
                if (nextEl && !nextEl.dataset.status) {
                    nextEl.focus();
                    break;
                }
            }
        }

        function revealAllBlanks() {
            blankRegistry.forEach(item => {
                const el = document.getElementById(item.id);
                if (el && !el.dataset.status) {
                    el.value = item.answer;
                    el.classList.add('wrong-revealed');
                    el.dataset.status = 'wrong';
                    wrongBlanks++;
                }
            });
            updateBlankProgress();
        }

        function resetBlanks() {
            renderBlanks();
        }

        function updateBlankProgress() {
            if (currentMode !== 'blank') return;
            const textEl = document.getElementById('progress-text');
            const correctBar = document.getElementById('progress-correct');
            const wrongBar = document.getElementById('progress-wrong');
            const labelEl = document.getElementById('progress-label');

            labelEl.innerText = `빈칸 인출 현황 (정답 ${correctBlanks} / 오답확인 ${wrongBlanks} / 전체 ${totalBlanks})`;
            textEl.innerText = `${correctBlanks + wrongBlanks} / ${totalBlanks}`;

            const cPct = totalBlanks === 0 ? 0 : (correctBlanks / totalBlanks) * 100;
            const wPct = totalBlanks === 0 ? 0 : (wrongBlanks / totalBlanks) * 100;
            correctBar.style.width = `${cPct}%`;
            wrongBar.style.width = `${wPct}%`;
        }

        // -------------------------------------------------------------------------
        // 2. 객관식 50문제 렌더링 및 채점 로직
        // -------------------------------------------------------------------------
        // 2. 객관식 150문제 (5세트 랜덤 출제 및 세트 전환 로직)
        // -------------------------------------------------------------------------
        function renderSetSelector() {
            const selectorContainer = document.getElementById('set-selector');
            let html = '';
            for (let i = 0; i < mcqSets.length; i++) {
                const isActive = (i === currentSetIdx);
                html += `<button onclick="changeSet(${i})" class="px-2.5 py-1 rounded-md text-xs font-bold transition ${isActive ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">세트 ${i + 1}</button>`;
            }
            selectorContainer.innerHTML = html;
        }

        function changeSet(setIdx) {
            currentSetIdx = setIdx;
            mcqAnswered = {};
            renderSetSelector();
            renderMCQ();
            updateMCQProgress();
            if (currentMode === 'mcq') {
                document.getElementById('mode-desc').innerHTML = `• 새로고침할 때마다 5개 세트(총 150문제) 중 하나가 랜덤 출제됩니다. 현재 <strong>[제 ${currentSetIdx + 1}세트]</strong>를 풀고 있습니다.`;
            }
        }

        function pickRandomSet() {
            let nextIdx = Math.floor(Math.random() * mcqSets.length);
            if (mcqSets.length > 1 && nextIdx === currentSetIdx) {
                nextIdx = (currentSetIdx + 1) % mcqSets.length;
            }
            changeSet(nextIdx);
        }

        function renderMCQ() {
            const container = document.getElementById('mcq-container');
            container.innerHTML = '';
            const currentQuestions = mcqSets[currentSetIdx];

            currentQuestions.forEach((item, qIdx) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6';
                card.id = `mcq-card-${qIdx}`;

                let optionsHTML = '';
                const numbers = ['①', '②', '③', '④'];
                item.options.forEach((opt, oIdx) => {
                    optionsHTML += `
                        <button onclick="selectMCQOption(${qIdx}, ${oIdx})" id="mcq-${qIdx}-opt-${oIdx}"
                            class="w-full text-left px-4 py-3 rounded-xl border border-slate-200 hover:bg-slate-50 transition flex items-start gap-2.5 text-sm sm:text-base text-slate-700 font-medium">
                            <span class="font-bold text-slate-400 mt-0.5">${numbers[oIdx]}</span>
                            <span class="break-keep">${opt}</span>
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="flex items-start gap-2.5 mb-4">
                        <span class="bg-indigo-100 text-indigo-700 font-bold text-xs px-2.5 py-1 rounded-md shrink-0 mt-0.5">Q${qIdx + 1}</span>
                        <h3 class="font-bold text-slate-800 text-base sm:text-lg leading-snug break-keep">${item.q}</h3>
                    </div>
                    <div class="space-y-2.5 mb-3">
                        ${optionsHTML}
                    </div>
                    <div id="mcq-exp-${qIdx}" class="hidden mt-4 p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-700 leading-relaxed">
                        <span class="font-bold text-indigo-600 block mb-1">💡 핵심 해설</span>
                        ${item.exp}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectMCQOption(qIdx, selectedIdx) {
            if (mcqAnswered[qIdx] !== undefined) return; // 이미 푼 문제 방지
            mcqAnswered[qIdx] = selectedIdx;

            const currentQuestions = mcqSets[currentSetIdx];
            const item = currentQuestions[qIdx];
            const isCorrect = (selectedIdx === item.ans);

            // 버튼 스타일 업데이트
            item.options.forEach((_, oIdx) => {
                const btn = document.getElementById(`mcq-${qIdx}-opt-${oIdx}`);
                btn.disabled = true;
                btn.classList.remove('hover:bg-slate-50');

                if (oIdx === item.ans) {
                    btn.className = "w-full text-left px-4 py-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold flex items-start gap-2.5 text-sm sm:text-base";
                    btn.querySelector('span').className = "font-bold text-emerald-600 mt-0.5";
                } else if (oIdx === selectedIdx && !isCorrect) {
                    btn.className = "w-full text-left px-4 py-3 rounded-xl border-2 border-rose-500 bg-rose-50 text-rose-900 font-bold flex items-start gap-2.5 text-sm sm:text-base";
                    btn.querySelector('span').className = "font-bold text-rose-600 mt-0.5";
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            // 해설 노출
            const expBox = document.getElementById(`mcq-exp-${qIdx}`);
            expBox.classList.remove('hidden');

            updateMCQProgress();
        }

        function resetMCQ() {
            mcqAnswered = {};
            renderMCQ();
            updateMCQProgress();
        }

        function updateMCQProgress() {
            if (currentMode !== 'mcq') return;
            const currentQuestions = mcqSets[currentSetIdx];
            const total = currentQuestions.length;
            let cCount = 0;
            let wCount = 0;

            Object.keys(mcqAnswered).forEach(qIdx => {
                if (mcqAnswered[qIdx] === currentQuestions[qIdx].ans) cCount++;
                else wCount++;
            });

            const textEl = document.getElementById('progress-text');
            const correctBar = document.getElementById('progress-correct');
            const wrongBar = document.getElementById('progress-wrong');
            const labelEl = document.getElementById('progress-label');

            labelEl.innerText = `[제 ${currentSetIdx + 1}세트] 풀이 현황 (정답 ${cCount} / 오답 ${wCount} / 전체 ${total})`;
            textEl.innerText = `${cCount + wCount} / ${total}`;

            correctBar.style.width = `${(cCount / total) * 100}%`;
            wrongBar.style.width = `${(wCount / total) * 100}%`;
        }

        // 앱 초기 실행 (새로고침 시 5개 세트 중 무작위 1개 세트 자동 선택)
        window.onload = function() {
            currentSetIdx = Math.floor(Math.random() * mcqSets.length);
            renderCategoryFilters();
            renderBlanks();
            renderSetSelector();
            renderMCQ();
        };
    </script>
</body>
</html>
