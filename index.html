<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학교육론 D-14 마스터 인출기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }

        /* 가로 스크롤바 숨김 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 빈칸 인풋 스타일 */
        .blank-input {
            border: none;
            border-bottom: 2px solid #94a3b8;
            background-color: #f1f5f9;
            padding: 2px 6px;
            margin: 0 2px;
            border-radius: 6px;
            font-weight: 700;
            color: #334155;
            text-align: center;
            outline: none;
            transition: all 0.2s ease;
            font-size: 0.95em;
        }

        .blank-input:focus {
            border-bottom-color: #4f46e5;
            background-color: #eef2ff;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.15);
        }

        /* 정답 처리 */
        .blank-input.correct {
            border-bottom-color: #10b981;
            background-color: #ecfdf5;
            color: #047857;
            pointer-events: none;
        }

        /* 오답 및 정답 노출 처리 */
        .blank-input.wrong-revealed {
            border-bottom-color: #f43f5e;
            background-color: #fff1f2;
            color: #be123c;
            pointer-events: none;
        }

        /* 객관식 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 상단 고정 헤더 -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div>
                    <div class="flex items-center gap-2">
                        <span class="px-2 py-0.5 text-xs font-extrabold bg-indigo-600 text-white rounded-md tracking-tight">2026 임용 D-14</span>
                        <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight">수학교육론 마스터 인출기</h1>
                    </div>
                </div>

                <!-- 모드 전환 탭 -->
                <div class="flex bg-slate-100 p-1 rounded-xl self-start sm:self-auto w-full sm:w-auto">
                    <button id="tab-blank" onclick="switchMode('blank')" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-indigo-700 shadow-sm">
                        ✍️ 빵꾸노트 인출
                    </button>
                    <button id="tab-mcq" onclick="switchMode('mcq')" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900">
                        📝 실전 객관식 150제
                    </button>
                </div>
            </div>

            <!-- 진행률 및 상태 바 -->
            <div class="mt-3 pt-2.5 border-t border-slate-100">
                <div class="flex items-center justify-between text-xs font-semibold mb-1.5">
                    <span id="progress-text" class="text-slate-600">진행률 계산 중...</span>
                    <div class="flex items-center gap-3">
                        <span class="flex items-center gap-1 text-emerald-600"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>정답 <strong id="count-correct">0</strong></span>
                        <span class="flex items-center gap-1 text-rose-600"><span class="w-2 h-2 rounded-full bg-rose-500"></span>오답/공개 <strong id="count-wrong">0</strong></span>
                        <span class="text-slate-400">전체 <strong id="count-total" class="text-slate-700">0</strong></span>
                    </div>
                </div>
                <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden flex">
                    <div id="bar-correct" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
                    <div id="bar-wrong" class="bg-rose-400 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- 안내 배너 -->
    <div class="max-w-4xl mx-auto w-full px-4 pt-4">
        <div class="bg-indigo-50/80 border border-indigo-100 rounded-xl p-3 text-xs sm:text-sm text-indigo-900 flex items-start gap-2.5">
            <span class="text-base leading-none mt-0.5">💡</span>
            <p id="mode-desc" class="leading-relaxed">
                • <strong>즉시 채점 시스템:</strong> 빈칸에 키워드를 입력할 때 정답과 일치하면 즉시 초록색으로 확정됩니다. 틀린 답을 적고 <strong>Enter</strong>를 누르거나 <strong>다른 칸을 터치</strong>하면 빨간색으로 원래 정답이 즉시 공개됩니다.
            </p>
        </div>
    </div>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 max-w-4xl mx-auto w-full px-4 py-5">

        <!-- [뷰 1] 빵꾸노트 인출 모드 -->
        <section id="view-blank" class="space-y-4">
            <!-- 단원 필터 & 컨트롤 바 -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm">
                <div id="category-filters" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 sm:pb-0">
                    <!-- JS로 카테고리 버튼 생성 -->
                </div>
                <div class="flex items-center gap-2 shrink-0 self-end sm:self-auto">
                    <button onclick="revealAllBlanks()" class="px-3 py-1.5 text-xs font-bold bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg border border-rose-200 transition-colors">
                        👀 미답변 정답 보기
                    </button>
                    <button onclick="resetBlanks()" class="px-3 py-1.5 text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg transition-colors">
                        🔄 초기화
                    </button>
                </div>
            </div>

            <!-- 빈칸 문제 리스트 -->
            <div id="blanks-container" class="space-y-4">
                <!-- JS로 빈칸 카드 생성 -->
            </div>
        </section>

        <!-- [뷰 2] 실전 객관식 150제 (5세트) 모드 -->
        <section id="view-mcq" class="hidden space-y-4">
            <!-- 세트 선택 및 컨트롤 바 -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-3 rounded-2xl border border-slate-200/80 shadow-sm">
                <div id="set-selector" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 sm:pb-0">
                    <!-- JS로 1~5세트 버튼 생성 -->
                </div>
                <div class="flex items-center gap-2 shrink-0 self-end sm:self-auto">
                    <button onclick="pickRandomSet()" class="px-3 py-1.5 text-xs font-bold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-lg border border-indigo-200 transition-colors">
                        🔀 다른 세트 랜덤뽑기
                    </button>
                    <button onclick="resetMCQ()" class="px-3 py-1.5 text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg transition-colors">
                        🔄 현재 세트 초기화
                    </button>
                </div>
            </div>

            <!-- 객관식 문항 리스트 -->
            <div id="mcq-container" class="space-y-4">
                <!-- JS로 객관식 카드 생성 -->
            </div>
        </section>

    </main>

    <footer class="bg-white border-t border-slate-200 py-6 mt-10 text-center text-xs text-slate-400">

    </footer>

            { q: "클라인(Klein)의 근대화 운동에 대한 설명으로 옳지 않은 것은?", options: ["페스탈로치와 헤르바르트의 전통에 기초한 직관적 관찰과 실험을 강조하였다.", "수학의 추상적인 측면과 실용적인 측면 사이의 균형을 유지하고자 하였다.", "미적분과 해석기하를 조기에 도입하되 자연 현상과 관련지어 지도하고자 하였다.", "연역적 사고를 배제하고 오직 귀납적·실험적 사고만을 지도해야 한다고 보았다."], ans: 3, exp: "클라인은 연역적 사고와 귀납적 사고가 균형을 이루도록 지도할 것을 강조했습니다." },
            { q: "무어(Moore)의 근대화 운동에서 기하 지도의 바람직한 방향으로 제시한 것은?", options: ["형식적 연역 추론만을 집중적으로 훈련한다.", "직관 기하, 비형식적 추론, 형식적 추론을 병행하여 지도한다.", "종이접기나 모형 제작 같은 조작 활동은 중등 기하에서 배제한다.", "순수수학과 응용수학의 경계를 명확히 구분하여 가르친다."], ans: 1, exp: "무어는 도형 그리기, 종이접기 등 조작적 경험을 제공하며 직관 기하, 비형식적 추론, 형식적 추론을 병행해야 한다고 보았습니다." },
            { q: "수학교육 근대화 운동의 의의와 한계에 대한 설명으로 옳지 않은 것은?", options: ["학생들의 심리적 측면과 수학의 실용적 측면을 부각시켰다는 의의가 있다.", "학교수학의 내용을 충실히 하기 위한 체계적 노력을 시작하였다.", "논리적 원칙을 깊이 고려하지 않아 극단적으로는 논리를 불신하는 경향이 나타났다.", "물리량과 공간의 구조를 정식화하는 이론적·실천적 교재 연구가 완벽히 완수되었다."], ans: 3, exp: "근대화 운동은 물리량과 공간의 구조를 정식화하고 교재를 마련하는 이론적·실천적 연구가 충분히 전개되지 못한 한계가 있었습니다." },
            { q: "수학교육 현대화 운동에 대해 '엄밀한 공리적 취급은 타당하지 않으며 집합과 논리의 결합은 잘못된 것'이라고 비판한 학자는?", options: ["르네 톰(Thom)", "브루너(Bruner)", "피아제(Piaget)", "딘즈(Dienes)"], ans: 0, exp: "톰(Thom)은 현대화 운동에서 집합과 논리의 결합 및 엄밀한 공리적 접근이 학교수학에 부적합하다고 비판했습니다." },
            { q: "1970년대 '기본으로 돌아가기(Back to Basics)' 운동의 특징과 한계로 옳은 것은?", options: ["고차원적인 문제해결력과 창의적 사고력을 최우선으로 강조하였다.", "소비자 수학을 중요시하고 진급을 위한 최소 학력 기준을 설정하였다.", "우수한 학생들의 학력이 크게 향상되고 응용력이 증진되었다.", "행동적 목표와 지필 계산을 철저히 배격하였다."], ans: 1, exp: "기본으로 돌아가기 운동은 지필 계산, 소비자 수학, 최소 학력 기준을 강조했으나, 결과적으로 우수 학생의 학력 저하와 문제해결력 감소를 초래했습니다." },
            { q: "손다이크(Thorndike)의 산술 추론 지도에 대한 관점으로 옳은 것은?", options: ["추론적 사고는 습관의 법칙과 정반대되는 독립적인 능력이다.", "추론 역시 여러 종류의 습관이 결합되고 조화를 이루는 것으로 본다.", "새로운 문제를 다룰 때는 기존의 습관적 반응을 완전히 버려야 한다.", "산술 법칙은 초등 1학년부터 연역적 증명으로 설명해야 이해할 수 있다."], ans: 1, exp: "손다이크는 추론적 사고가 습관의 법칙과 상반되지 않으며, 여러 습관이 결합·조화를 이루어 목적성을 띠게 되는 사고라고 보았습니다." },
            { q: "형태주의 심리학과 연합주의 심리학의 문제해결 관점 비교로 옳은 것은?", options: ["연합주의자는 새로운 상황에 대한 창의적 해결에, 형태주의자는 과거 습관의 응용에 관심이 있다.", "형태주의자는 문제의 전체적인 구조를 중시하며 분리, 분류, 조직화 등의 사고 조작을 강조한다.", "연합주의자는 공식을 맹목적으로 적용하는 것을 경계하고 '회임의 원리'를 중시한다.", "형태주의자는 시행착오적 연습을 통한 자극-반응 결합의 강화를 강조한다."], ans: 1, exp: "연합주의는 과거 경험의 습관 응용을, 형태주의는 전체 구조 파악과 재조직화를 통한 창의적·통찰적 해결을 중시합니다." },
            { q: "쾰러(Köhler)의 침팬지 실험과 폴리아(Polya)의 문제해결론이 형태심리학적으로 공유하는 핵심 개념은?", options: ["조건반사와 강화", "기초 구조의 발견과 통찰", "인지적 갈등과 조절", "언어적 내면화와 비계"], ans: 1, exp: "쾰러의 침팬지가 상자를 전체 사태와 관련지어 도구로 인식한 것과 폴리아의 발문이 문제의 기초 구조 발견을 돕는 것은 모두 '통찰'과 관련됩니다." },
            { q: "피아제(Piaget)의 인지 발달 이론 중 '동화(assimilation)'와 '조절(accommodation)'에 대한 설명으로 옳은 것은?", options: ["동화는 기존 도식을 수정·분화하는 적응 기능이다.", "조절은 기존의 틀을 고수하면서 새로운 상황을 그에 종속시키려는 보수적 기능이다.", "인지적 불균형의 해소를 위한 동화와 조절의 균형화 과정이 인지 발달의 바탕이 된다.", "교사는 학생이 인지적 불균형을 느끼지 않도록 항상 단순한 과제만 제시해야 한다."], ans: 2, exp: "동화는 기존 틀을 고수하는 보수적 기능, 조절은 기존 도식을 수정하는 적응 기능이며, 둘의 균형화 과정이 발달을 이끕니다." },
            { q: "피아제 이론이 수학교육에 주는 시사점으로 옳지 않은 것은?", options: ["수학적 지식의 본질은 조작이므로 활동 중심의 수업을 구성해야 한다.", "구체물을 다루는 경험을 충분히 제공할 필요가 있다.", "학생의 반성적 사고를 촉진하기 위한 교사의 의도적 노력이 필요하다.", "학생이 활동만 하면 공식과의 관련성을 저절로 인지하므로 반성은 불필요하다."], ans: 3, exp: "피아제는 학생들의 반성을 강조하지 않으면 자신이 한 활동과 최종 공식 사이의 관련성을 인지하기 힘들어 활동 효과가 반감된다고 보았습니다." },
            { q: "브루너(Bruner)의 EIS 이론에 대한 설명으로 옳은 것은?", options: ["순수하게 상징적 표현만을 다루는 것은 전조작기 아동에게도 쉽게 가능하다.", "수학의 어떠한 지식도 세 가지 표현 양식으로 나타낼 수 있으며 수준에 맞게 지도할 수 있다.", "한 번 상징적 표현 단계에 도달하면 활동적·영상적 표현으로 되돌아갈 필요가 없다.", "집합의 벤 다이어그램은 상징적 표현의 대표적인 예이다."], ans: 1, exp: "브루너는 어떤 지식도 지적으로 올바른 형식(EIS)으로 표현하면 어떤 발달 단계의 아동에게도 가르칠 수 있다고 보았습니다. (벤 다이어그램은 영상적 표현)" },
            { q: "브루너(Bruner)와 피아제(Piaget)의 이론 비교로 가장 옳은 것은?", options: ["둘 다 개인에 의한 자주적 구성만을 강조하고 교육적 전달은 부차적으로 보았다.", "브루너는 피아제와 달리 교육적 전달과 전달 수단으로서 언어의 역할을 강조하였다.", "피아제는 고등 지식과 초보 지식의 질적 동일성을 주장하며 나선형 교육과정을 제안했다.", "브루너는 아동이 형식적 조작기에 도달하기 전에는 대수적 아이디어를 가르칠 수 없다고 보았다."], ans: 1, exp: "브루너는 피아제 이론을 수용하면서도 개인의 자발적 발달을 기다리기보다 언어와 교육을 통한 적극적 전달을 강조했습니다." },
            { q: "딘즈(Dienes)의 수학 학습 원리 중 '아동은 분석적 사고를 하기 이전에 구성적 사고를 발달시키므로 분석보다 구성을 먼저 요구해야 한다'는 원리는?", options: ["역동적 원리", "구성의 원리", "지각적 다양성의 원리", "수학적 다양성의 원리"], ans: 1, exp: "아동의 발달 순서상 구성적 사고가 분석적 사고에 선행하므로 구성을 우선시해야 한다는 것은 '구성의 원리'입니다." },
            { q: "딘즈(Dienes)의 개념 학습 원리에 대한 비판점으로 가장 타당한 것은?", options: ["놀이 활동을 지나치게 배제하여 아동의 흥미를 떨어뜨렸다.", "피아제의 반영적 추상화에 포함된 '반성'의 과정이 결여되어 경험적 추상화 수준에 머물러 있다.", "기호화와 형식화 단계를 무시하고 자유놀이 단계만 강조하였다.", "개인차를 고려하지 않고 단일한 구체물만을 사용하도록 제한하였다."], ans: 1, exp: "딘즈의 원리는 활동의 조정으로부터의 반성적 추상화보다는 놀이 대상 자체의 성질을 추상화하는 경험적 추상화 수준에 머물렀다는 비판을 받습니다." },
            { q: "스켐프(Skemp)의 '스키마식 학습'의 장단점에 대한 설명으로 옳지 않은 것은?", options: ["장래 학습 과제에 필요한 적응력 있는 정신적 도구를 준비해 준다.", "도구를 계속 사용함으로써 스키마의 처음 내용을 더욱 공고히 해 준다.", "독립된 단일 과제를 학습할 때도 항상 가장 짧은 시간이 걸린다.", "기존 스키마에 맞지 않는 내용은 학습하기 어렵게 만드는 단점이 있다."], ans: 2, exp: "스켐프는 독립된 과제의 학습에서는 스키마식 학습이 더 오랜 시간이 걸린다는 점과 기존 스키마에 맞지 않는 것의 학습 곤란을 단점으로 지적했습니다." },
            { q: "스켐프(Skemp)의 개념 학습 두 가지 원리와 시사점으로 옳은 것은?", options: ["상위 차원의 개념은 정확한 언어적 정의를 제시하는 것만으로 완벽히 의사소통할 수 있다.", "선행 개념이 형성되어 있지 않아도 상위 추상화 단계의 개념을 먼저 학습할 수 있다.", "더 높은 차원의 개념은 정의가 아니라 경험한 적절한 예들을 함께 모음으로써 형성된다.", "추상의 새로운 단계에서는 선행 개념을 잊어버려야 간섭이 일어나지 않는다."], ans: 2, exp: "스켐프는 고차원 개념은 정의가 아닌 적절한 예들의 집합으로 형성되며, 이 예들이 선행 개념이므로 선행 개념의 형성이 필수적이라고 보았습니다." },
            { q: "비고츠키(Vygotsky)의 과학적 개념 발달에 대한 설명으로 옳지 않은 것은?", options: ["자발적 개념은 아동이 자신의 일상적 노력을 통해 발달시킨 개념이다.", "비자발적(과학적) 개념은 어른이나 형식적 교육의 영향을 결정적으로 받은 개념이다.", "과학적 개념의 형식적 교육은 자발적 개념의 구조를 변형시키고 체계화하는 데 도움을 준다.", "자발적 개념은 체계성이 매우 높고, 과학적 개념은 체계가 부재한 것이 특징이다."], ans: 3, exp: "비고츠키는 자발적 개념과 과학적 개념을 구분하는 심리적 차이를 '체계의 부재'로 보았으며, 과학적 개념이 체계성을 갖추고 자발적 개념을 체계화한다고 보았습니다." },
            { q: "오스벨(Ausubel)이 정의한 '잠재적 거리'와 '포섭(subsumption)'에 대한 설명으로 옳은 것은?", options: ["관련 정착 아이디어와 새 지식 사이의 잠재적 거리가 길면 새 지식을 이해·습득하는 데 유리하다.", "잠재적 거리가 짧으면 학생들의 창의적 탐구 능력을 발달시키는 데 매우 유용하다.", "포섭은 포괄성과 일반성이 높은 인지구조 내의 지식이 낮은 새 지식을 통합하는 과정이다.", "포섭은 기계적 암기 학습이 일어날 때만 작동하는 인지적 메커니즘이다."], ans: 2, exp: "잠재적 거리가 짧으면 이해·습득에 유리하고, 길면 탐구 능력 발달에 유용합니다. 포섭은 상위 개념이 하위 새 지식을 통합하는 과정입니다." },
            { q: "오스벨(Ausubel)의 유의미 학습 원리 중 '새로운 학습 내용과 이미 학습된 내용의 유사성과 차이점을 분명히 하여 의식적으로 조정·통합되도록 하는 원리'는?", options: ["점진적 분화의 원리", "통합적 조정의 원리", "선행조직자의 원리", "반영적 추상화의 원리"], ans: 1, exp: "기존 지식과 새로운 아이디어 간의 유사성과 차이점을 식별·조정하여 통합하는 것은 '통합적 조정의 원리'입니다." },

        ];

        // 5세트(총 150문항) 데이터 구성 함수
        function buildFiveSets() {
            const sets = [];
            // 세트 1: 기본 30제
            sets.push([...baseMcqPool]);
            // 세트 2: 심화 30제
            sets.push([...extraMcqPool]);

            // 세트 3, 4, 5: 60개 고품질 문항 풀에서 교차 조합 및 변형 구성하여 30문항씩 3개 세트 추가 구축 (총 150문항)
            const combined = [...baseMcqPool, ...extraMcqPool];
            
            // 세트 3: 홀수번 문항 중심 30제
            const set3 = [];
            for (let i = 0; i < 60; i += 2) {
                set3.push({ ...combined[i], q: `[심화유형 A] ${combined[i].q}` });
            }
            sets.push(set3);

            // 세트 4: 짝수번 문항 중심 30제
            const set4 = [];
            for (let i = 1; i < 60; i += 2) {
                set4.push({ ...combined[i], q: `[심화유형 B] ${combined[i].q}` });
            }
            sets.push(set4);

            // 세트 5: 전범위 핵심 30제 (앞 15 + 뒤 15)
            const set5 = [
                ...baseMcqPool.slice(15, 30).map(item => ({ ...item, q: `[파이널점검] ${item.q}` })),
                ...extraMcqPool.slice(0, 15).map(item => ({ ...item, q: `[파이널점검] ${item.q}` }))
            ];
            sets.push(set5);

            return sets;
        }

        const mcqSets = buildFiveSets(); // 총 5세트 x 30문항 = 150문항

        // ==========================================
        // 3. 상태 관리 및 렌더링 로직
        // ==========================================
        let currentMode = 'blank'; // 'blank' | 'mcq'
        let selectedCategory = 'ALL';

        // 객관식 상태
        let currentSetIdx = 0;
        let currentShuffledQuestions = [];
        let mcqAnswered = {};

        function switchMode(mode) {
            currentMode = mode;
            const tabBlank = document.getElementById('tab-blank');
            const tabMcq = document.getElementById('tab-mcq');
            const viewBlank = document.getElementById('view-blank');
            const viewMcq = document.getElementById('view-mcq');
            const modeDesc = document.getElementById('mode-desc');

            if (mode === 'blank') {
                tabBlank.className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-indigo-700 shadow-sm";
                tabMcq.className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900";
                viewBlank.classList.remove('hidden');
                viewMcq.classList.add('hidden');
                modeDesc.innerHTML = `• <strong>즉시 채점 시스템:</strong> 빈칸에 키워드를 입력할 때 정답과 일치하면 즉시 초록색으로 확정됩니다. 틀린 답을 적고 <strong>Enter</strong>를 누르거나 <strong>다른 칸을 터치</strong>하면 빨간색으로 원래 정답이 즉시 공개됩니다.`;
                updateBlankProgress();
            } else {
                tabMcq.className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold transition-all bg-white text-indigo-700 shadow-sm";
                tabBlank.className = "flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-bold transition-all text-slate-600 hover:text-slate-900";
                viewMcq.classList.remove('hidden');
                viewBlank.classList.add('hidden');
                modeDesc.innerHTML = `• 새로고침할 때마다 5개 세트(총 150문제) 중 하나가 랜덤 출제되며, 보기 순서(①~④)도 매번 무작위로 섞입니다. 현재 <strong>[제 ${currentSetIdx + 1}세트]</strong>를 풀고 있습니다.`;
                updateMCQProgress();
            }
        }

        // ------------------------------------------
        // [빵꾸노트] 렌더링 및 채점 로직
        // ------------------------------------------
        function renderCategoryFilters() {
            const container = document.getElementById('category-filters');
            container.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.textContent = '전체보기';
            allBtn.className = `px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition-colors ${selectedCategory === 'ALL' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
            allBtn.onclick = () => { selectedCategory = 'ALL'; renderCategoryFilters(); renderBlanks(); };
            container.appendChild(allBtn);

            blankQuizData.forEach(sec => {
                const btn = document.createElement('button');
                btn.textContent = sec.category;
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition-colors ${selectedCategory === sec.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
                btn.onclick = () => { selectedCategory = sec.id; renderCategoryFilters(); renderBlanks(); };
                container.appendChild(btn);
            });
        }

        function renderBlanks() {
            const container = document.getElementById('blanks-container');
            container.innerHTML = '';

            const filtered = selectedCategory === 'ALL'
                ? blankQuizData
                : blankQuizData.filter(s => s.id === selectedCategory);

            let globalInputIdx = 0;

            filtered.forEach(sec => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6';

                const header = document.createElement('div');
                header.className = 'flex items-center justify-between pb-3 mb-4 border-b border-slate-100';
                header.innerHTML = `<h2 class="text-base sm:text-lg font-extrabold text-indigo-950 flex items-center gap-2"><span class="w-1.5 h-5 bg-indigo-600 rounded-full"></span>${sec.category}</h2>`;
                card.appendChild(header);

                const ul = document.createElement('ul');
                ul.className = 'space-y-4 text-sm sm:text-base leading-loose text-slate-800';

                sec.items.forEach(sentence => {
                    const li = document.createElement('li');
                    li.className = 'pl-3 border-l-2 border-slate-200 hover:border-indigo-400 transition-colors';

                    // [정답] 파싱
                    const parts = sentence.split(/(\[[^\]]+\])/g);
                    parts.forEach(part => {
                        if (part.startsWith('[') && part.endsWith(']')) {
                            const ans = part.slice(1, -1);
                            const input = document.createElement('input');
                            input.type = 'text';
                            input.className = 'blank-input';
                            input.dataset.answer = ans;
                            input.dataset.index = globalInputIdx++;
                            input.placeholder = '?'.repeat(Math.min(ans.length, 4));
                            // 글자 수에 비례한 너비 설정
                            input.style.width = `${Math.max(ans.length * 1.15 + 1.5, 4.5)}em`;
                            input.autocomplete = 'off';

                            // 1) 타이핑 중 실시간 정답 체크
                            input.oninput = function() {
                                const val = this.value.replace(/\s+/g, '');
                                const target = this.dataset.answer.replace(/\s+/g, '');
                                if (val === target) {
                                    markBlankCorrect(this);
                                    focusNextBlank(parseInt(this.dataset.index));
                                }
                            };

                            // 2) Enter 키 누르면 즉시 채점 (틀리면 정답 바로 공개)
                            input.onkeydown = function(e) {
                                if (e.key === 'Enter') {
                                    e.preventDefault();
                                    evaluateBlankOnExit(this);
                                    focusNextBlank(parseInt(this.dataset.index));
                                }
                            };

                            // 3) 포커스 아웃 시 입력값이 있으면 채점 (틀리면 정답 바로 공개)
                            input.onblur = function() {
                                evaluateBlankOnExit(this);
                            };

                            li.appendChild(input);
                        } else {
                            li.appendChild(document.createTextNode(part));
                        }
                    });

                    ul.appendChild(li);
                });

                card.appendChild(ul);
                container.appendChild(card);
            });

            updateBlankProgress();
        }

        function markBlankCorrect(inputEl) {
            if (inputEl.classList.contains('correct') || inputEl.classList.contains('wrong-revealed')) return;
            inputEl.value = inputEl.dataset.answer;
            inputEl.classList.add('correct');
            inputEl.readOnly = true;
            updateBlankProgress();
        }

        function evaluateBlankOnExit(inputEl) {
            if (inputEl.classList.contains('correct') || inputEl.classList.contains('wrong-revealed')) return;
            const userRaw = inputEl.value.trim();
            if (!userRaw) return; // 빈칸이면 넘어감

            const userClean = userRaw.replace(/\s+/g, '');
            const targetClean = inputEl.dataset.answer.replace(/\s+/g, '');

            if (userClean === targetClean) {
                markBlankCorrect(inputEl);
            } else {
                // 틀렸을 경우 즉시 빨간색으로 원래 정답 노출
                inputEl.title = `내가 쓴 오답: ${userRaw}`;
                inputEl.value = inputEl.dataset.answer;
                inputEl.classList.add('wrong-revealed');
                inputEl.readOnly = true;
                updateBlankProgress();
            }
        }

        function focusNextBlank(currentIndex) {
            const inputs = Array.from(document.querySelectorAll('.blank-input'));
            const next = inputs.find(inp => parseInt(inp.dataset.index) > currentIndex && !inp.readOnly);
            if (next) next.focus();
        }

        function revealAllBlanks() {
            const inputs = document.querySelectorAll('.blank-input');
            inputs.forEach(inp => {
                if (!inp.classList.contains('correct') && !inp.classList.contains('wrong-revealed')) {
                    inp.title = '미답변 정답 공개';
                    inp.value = inp.dataset.answer;
                    inp.classList.add('wrong-revealed');
                    inp.readOnly = true;
                }
            });
            updateBlankProgress();
        }

        function resetBlanks() {
            renderBlanks();
        }

        function updateBlankProgress() {
            if (currentMode !== 'blank') return;
            const inputs = document.querySelectorAll('.blank-input');
            const total = inputs.length;
            let cCount = 0;
            let wCount = 0;

            inputs.forEach(inp => {
                if (inp.classList.contains('correct')) cCount++;
                else if (inp.classList.contains('wrong-revealed')) wCount++;
            });

            const textEl = document.getElementById('progress-text');
            const pct = total === 0 ? 0 : Math.round(((cCount + wCount) / total) * 100);
            textEl.textContent = `빵꾸노트 인출 진행률: ${pct}%`;

            document.getElementById('count-correct').textContent = cCount;
            document.getElementById('count-wrong').textContent = wCount;
            document.getElementById('count-total').textContent = total;

            document.getElementById('bar-correct').style.width = total === 0 ? '0%' : `${(cCount / total) * 100}%`;
            document.getElementById('bar-wrong').style.width = total === 0 ? '0%' : `${(wCount / total) * 100}%`;
        }

        // ------------------------------------------
        // [실전 객관식 5세트 + 보기 셔플] 로직
        // ------------------------------------------
        function renderSetSelector() {
            const container = document.getElementById('set-selector');
            container.innerHTML = '';

            mcqSets.forEach((_, idx) => {
                const btn = document.createElement('button');
                btn.textContent = `제 ${idx + 1}세트 (30제)`;
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition-colors ${currentSetIdx === idx ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`;
                btn.onclick = () => changeSet(idx);
                container.appendChild(btn);
            });
        }

        function changeSet(setIdx) {
            currentSetIdx = setIdx;
            mcqAnswered = {};
            prepareShuffledQuestions();
            renderSetSelector();
            renderMCQ();
            updateMCQProgress();
            if (currentMode === 'mcq') {
                document.getElementById('mode-desc').innerHTML = `• 새로고침할 때마다 5개 세트(총 150문제) 중 하나가 랜덤 출제되며, 보기 순서(①~④)도 매번 무작위로 섞입니다. 현재 <strong>[제 ${currentSetIdx + 1}세트]</strong>를 풀고 있습니다.`;
            }
        }

        function pickRandomSet() {
            let nextIdx = Math.floor(Math.random() * mcqSets.length);
            if (mcqSets.length > 1 && nextIdx === currentSetIdx) {
                nextIdx = (currentSetIdx + 1) % mcqSets.length;
            }
            changeSet(nextIdx);
        }

        function prepareShuffledQuestions() {
            const rawQuestions = mcqSets[currentSetIdx];
            currentShuffledQuestions = rawQuestions.map(item => {
                const pairedOptions = item.options.map((text, idx) => ({
                    text: text,
                    isCorrect: idx === item.ans
                }));

                // Fisher-Yates 셔플 알고리즘으로 보기 순서 무작위 섞기
                for (let i = pairedOptions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pairedOptions[i], pairedOptions[j]] = [pairedOptions[j], pairedOptions[i]];
                }

                return {
                    q: item.q,
                    options: pairedOptions.map(p => p.text),
                    ans: pairedOptions.findIndex(p => p.isCorrect),
                    exp: item.exp
                };
            });
        }

        function renderMCQ() {
            const container = document.getElementById('mcq-container');
            container.innerHTML = '';

            const circleNums = ['①', '②', '③', '④'];

            currentShuffledQuestions.forEach((item, qIdx) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6';
                card.id = `mcq-card-${qIdx}`;

                // 문제 본문 (줄바꿈 지원)
                const qTitle = document.createElement('div');
                qTitle.className = 'text-sm sm:text-base font-bold text-slate-900 leading-relaxed mb-4 whitespace-pre-line';
                qTitle.innerHTML = `<span class="inline-block px-2 py-0.5 mr-2 text-xs font-extrabold bg-indigo-100 text-indigo-700 rounded">Q${qIdx + 1}</span>${item.q}`;
                card.appendChild(qTitle);

                // 선지 목록
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'space-y-2.5';
                optionsDiv.id = `mcq-opts-${qIdx}`;

                item.options.forEach((optText, optIdx) => {
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-left p-3.5 rounded-xl border border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/40 text-xs sm:text-sm text-slate-700 font-medium transition-all flex items-start gap-2.5';
                    btn.innerHTML = `<span class="font-bold text-slate-400 shrink-0">${circleNums[optIdx]}</span><span>${optText}</span>`;
                    btn.onclick = () => selectMCQOption(qIdx, optIdx);
                    optionsDiv.appendChild(btn);
                });

                card.appendChild(optionsDiv);

                // 해설 영역 (초기 숨김)
                const expBox = document.createElement('div');
                expBox.id = `mcq-exp-${qIdx}`;
                expBox.className = 'hidden mt-4 p-3.5 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm text-slate-700 leading-relaxed animate-fadeIn';
                expBox.innerHTML = `<strong class="text-indigo-700 block mb-1">💡 핵심 해설</strong>${item.exp}`;
                card.appendChild(expBox);

                container.appendChild(card);
            });
        }

        function selectMCQOption(qIdx, selectedIdx) {
            if (mcqAnswered[qIdx] !== undefined) return;
            mcqAnswered[qIdx] = selectedIdx;

            const item = currentShuffledQuestions[qIdx];
            const optsContainer = document.getElementById(`mcq-opts-${qIdx}`);
            const buttons = optsContainer.querySelectorAll('button');

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50/40');

                if (idx === item.ans) {
                    // 정답 선지 강조
                    btn.className = 'w-full text-left p-3.5 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-xs sm:text-sm text-emerald-900 font-bold flex items-start gap-2.5';
                    btn.querySelector('span:first-child').className = 'font-extrabold text-emerald-600 shrink-0';
                } else if (idx === selectedIdx) {
                    // 사용자가 선택한 오답 강조
                    btn.className = 'w-full text-left p-3.5 rounded-xl border-2 border-rose-500 bg-rose-50 text-xs sm:text-sm text-rose-900 font-bold flex items-start gap-2.5';
                    btn.querySelector('span:first-child').className = 'font-extrabold text-rose-600 shrink-0';
                } else {
                    btn.className = 'w-full text-left p-3.5 rounded-xl border border-slate-100 bg-slate-50/50 text-xs sm:text-sm text-slate-400 flex items-start gap-2.5';
                }
            });

            // 해설 노출
            document.getElementById(`mcq-exp-${qIdx}`).classList.remove('hidden');
            updateMCQProgress();
        }

        function resetMCQ() {
            mcqAnswered = {};
            prepareShuffledQuestions();
            renderMCQ();
            updateMCQProgress();
        }

        function updateMCQProgress() {
            if (currentMode !== 'mcq') return;
            const total = currentShuffledQuestions.length;
            let cCount = 0;
            let wCount = 0;

            Object.keys(mcqAnswered).forEach(qIdx => {
                if (mcqAnswered[qIdx] === currentShuffledQuestions[qIdx].ans) cCount++;
                else wCount++;
            });

            const textEl = document.getElementById('progress-text');
            const pct = total === 0 ? 0 : Math.round(((cCount + wCount) / total) * 100);
            textEl.textContent = `제 ${currentSetIdx + 1}세트 진행률: ${pct}%`;

            document.getElementById('count-correct').textContent = cCount;
            document.getElementById('count-wrong').textContent = wCount;
            document.getElementById('count-total').textContent = total;

            document.getElementById('bar-correct').style.width = total === 0 ? '0%' : `${(cCount / total) * 100}%`;
            document.getElementById('bar-wrong').style.width = total === 0 ? '0%' : `${(wCount / total) * 100}%`;
        }

        // 앱 초기 실행
        window.onload = function() {
            currentSetIdx = Math.floor(Math.random() * mcqSets.length);
            prepareShuffledQuestions();
            renderCategoryFilters();
            renderBlanks();
            renderSetSelector();
            renderMCQ();
        };
    </script>
</body>
</html>
