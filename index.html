<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 수학교육론 D-14 마스터 인출기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        /* 빈칸 인풋 스타일 */
        .blank-input {
            border: none;
            border-bottom: 2px solid #94a3b8;
            background-color: #f1f5f9;
            border-radius: 4px 4px 0 0;
            text-align: center;
            font-weight: 700;
            color: #2563eb;
            transition: all 0.2s ease;
            padding: 2px 6px;
            margin: 2px 4px;
            font-size: 0.95rem;
        }
        .blank-input:focus {
            outline: none;
            border-bottom-color: #2563eb;
            background-color: #dbeafe;
        }
        .blank-input.correct {
            border-bottom-color: #10b981;
            background-color: #d1fae5;
            color: #065f46;
            pointer-events: none;
        }
        .blank-input.wrong-revealed {
            border-bottom-color: #ef4444;
            background-color: #fee2e2;
            color: #b91c1c;
            pointer-events: none;
        }
        /* 진행바 애니메이션 */
        .progress-fill {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>

    <!-- 상단 헤더 & 모드 전환 탭 -->
    <header class="w-full max-w-4xl bg-white rounded-2xl shadow-sm p-5 sm:p-6 mb-5 border-t-4 border-indigo-600">

            <div class="flex bg-slate-100 p-1 rounded-xl self-start sm:self-auto">
                <button id="tab-blank" onclick="switchMode('blank')" class="px-4 py-2 rounded-lg text-sm font-bold bg-white text-indigo-600 shadow-sm transition">

                </button>

                </button>
            </div>
        </div>

            • 정답을 입력하면 즉시 채점됩니다. <strong>틀린 답을 적고 Enter(또는 다른 곳 터치)를 누르면 즉시 정답이 공개</strong>됩니다.
        </p>

        <!-- 진도율 바 -->
        <div class="mt-4 pt-4 border-t border-slate-100">
            <div class="flex justify-between text-xs sm:text-sm font-semibold text-slate-600 mb-1.5">
                <span id="progress-label">학습 완료도 (맞힘 / 오답공개 / 전체)</span>
                <span id="progress-text" class="text-indigo-600">0 / 0</span>

        </div>
    </header>

    <!-- 1. 빵꾸노트 (빈칸 채우기) 뷰 -->
    <!-- ========================================== -->
    <main id="view-blank" class="w-full max-w-4xl">

        <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div class="flex gap-1.5 overflow-x-auto pb-1 max-w-full" id="category-filters">
                <!-- JS로 필터 버튼 생성 -->
            </div>
            <div class="flex gap-2 ml-auto">
                <button onclick="resetBlanks()" class="bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 px-3 py-1.5 rounded-lg shadow-sm font-semibold transition text-xs sm:text-sm">
                    초기화
                </button>
                <button onclick="revealAllBlanks()" class="bg-indigo-600 text-white hover:bg-indigo-700 px-3 py-1.5 rounded-lg shadow-sm font-semibold transition text-xs sm:text-sm">

                </button>
            </div>
        </div>

        <div id="blank-container" class="space-y-5 pb-20">
            <!-- JS로 문제 카드 생성 -->
        </div>
    </main>

        </div>

        <div id="mcq-container" class="space-y-4 pb-20">
            <!-- JS로 50문제 생성 -->
        </div>
    </main>

                ],
                ans: 1,

            },
            {

                options: [

            },
            {
                q: "프로젝트 평가와 포트폴리오 평가에 대한 설명으로 옳지 않은 것은?",
                options: [

                    "포트폴리오 결과 처리는 각 구성물에 엄격한 가중치를 부여해 단일 수치 점수로 환산하는 것을 원칙으로 한다."
                ],
                ans: 3,
                exp: "포트폴리오는 가중치를 주어 수량화·점수화하는 것이 현실적으로 불가능하므로, 행동 측면을 중심으로 학생의 발달 정도를 교사의 전문적 판단에 따라 진술문으로 기술합니다."
            },
            {
                q: "관찰 및 면담 평가의 특징과 기록 방법에 대한 설명으로 옳지 않은 것은?",
                options: [
                    "인지적 영역뿐만 아니라 수학에 대한 태도와 신념 등 정의적 영역까지 평가할 수 있다.",
                    "면담 시 교사는 대화의 방향을 유도하기 위해 적극적이고 지시적인 태도를 취해야 한다.",
                    "일화기록법은 별다른 준비 없이 예기치 않은 행동을 포착해 기록할 수 있으나 분석에 시간이 많이 든다.",
                    "체크리스트와 평정척도법은 사전 제작에 노력이 들지만 기록 자료를 재분석 없이 수월하게 활용할 수 있다."
                ],
                ans: 1,
                exp: "면담 시 교사의 반응이나 질문으로 대화의 방향이 바뀌어서는 안 되므로 교사는 '중립적'이고 자연스러운 태도를 취해야 합니다."
            },
            {
                q: "공학적 도구가 수학교육에 기여하는 측면에 대한 설명으로 옳지 않은 것은?",
                options: [
                    "GSP나 Cabri에서 도형의 요소를 마우스로 끌어도 변하지 않는 성질을 탐구하는 것은 딘즈의 수학적 다양성의 원리에 부합한다.",
                    "LOGO 프로그래밍에서 거북의 움직임을 통해 자신의 사고를 인식하고 오류를 수정하는 활동은 반영적 추상화에 기여한다.",
                    "기호 조작 그 자체가 교수·학습의 목적인 경우에도 CAS(Maple 등)를 적극 활용하여 계산 과정을 생략시켜야 한다.",
                    "원주율 π의 참값을 컴퓨터에 입력할 수 없다는 공학적 도구의 한계를 역이용해 무리수 개념을 암묵적으로 도입할 수 있다."
                ],
                ans: 2,
                exp: "기호 조작 그 자체가 교수·학습의 목적인 경우에는 CAS(기호 조작 소프트웨어)를 사용해서는 안 됩니다."
            },
            {
                q: "컴퓨터를 이용한 수학 교수·학습 양식 4가지의 연결이 옳은 것은?",
                options: [
                    "개인 교사형 - LOGO, BASIC",
                    "학생 주도형 - CAI 소프트웨어, Geometry Tutor",
                    "보조 도구형 - Maple, Mathematica (CAS)",
                    "탐구 학습형 - 단순 연산 드릴용 프로그램"
                ],
                ans: 2,
                exp: "개인 교사형은 CAI·Geometry Tutor, 학생 주도형은 LOGO·BASIC, 보조 도구형은 CAS(Maple, Mathematica), 탐구 학습형은 GSP·Cabri입니다."
            }
        ];

        // =========================================================================
        // STATE & LOGIC: 앱 상태 관리 및 인터랙션
        // =========================================================================
        let currentMode = 'blank';
        let selectedCategory = 'all';

        // 빵꾸노트 상태
        let totalBlanks = 0;
        let correctBlanks = 0;
        let wrongBlanks = 0;
        let blankRegistry = [];

        // 객관식 상태
        let mcqAnswered = {}; // { qIndex: selectedOptionIndex }

        function switchMode(mode) {
            currentMode = mode;
            const tabBlank = document.getElementById('tab-blank');
            const tabMcq = document.getElementById('tab-mcq');
            const viewBlank = document.getElementById('view-blank');
            const viewMcq = document.getElementById('view-mcq');
            const modeDesc = document.getElementById('mode-desc');

            if (mode === 'blank') {
                tabBlank.className = "px-4 py-2 rounded-lg text-sm font-bold bg-white text-indigo-600 shadow-sm transition";
                tabMcq.className = "px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 transition";
                viewBlank.classList.remove('hidden');
                viewMcq.classList.add('hidden');
                modeDesc.innerHTML = "• 정답을 입력하면 즉시 통과됩니다. <strong>틀린 답을 입력한 상태에서 Enter를 누르거나 다른 곳을 터치하면 즉시 정답이 공개</strong>됩니다.";
                updateBlankProgress();
            } else {
                tabMcq.className = "px-4 py-2 rounded-lg text-sm font-bold bg-white text-indigo-600 shadow-sm transition";
                tabBlank.className = "px-4 py-2 rounded-lg text-sm font-bold text-slate-600 hover:text-slate-900 transition";
                viewMcq.classList.remove('hidden');
                viewBlank.classList.add('hidden');
                modeDesc.innerHTML = "• 각 문항의 선지를 클릭하면 즉시 정답 여부와 핵심 해설이 표시됩니다.";
                updateMCQProgress();
            }
        }

        // -------------------------------------------------------------------------
        // 1. 빵꾸노트 렌더링 및 즉시 채점/오답공개 로직
        // -------------------------------------------------------------------------
        function renderCategoryFilters() {
            const filterContainer = document.getElementById('category-filters');
            let html = `<button onclick="filterCategory('all')" class="cat-btn px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${selectedCategory === 'all' ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}">전체 영역</button>`;
            
            blankQuizData.forEach(sec => {
                const shortName = sec.category.split(' ')[1];
                const isActive = selectedCategory === sec.id;
                html += `<button onclick="filterCategory('${sec.id}')" class="cat-btn px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition ${isActive ? 'bg-indigo-600 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}">${shortName}</button>`;
            });
            filterContainer.innerHTML = html;
        }

        function filterCategory(catId) {
            selectedCategory = catId;
            renderCategoryFilters();
            renderBlanks();
        }

        function renderBlanks() {
            const container = document.getElementById('blank-container');
            container.innerHTML = '';
            totalBlanks = 0;
            correctBlanks = 0;
            wrongBlanks = 0;
            blankRegistry = [];

            const filteredData = selectedCategory === 'all' 
                ? blankQuizData 
                : blankQuizData.filter(d => d.id === selectedCategory);

            filteredData.forEach((section, sIdx) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden';

                const header = document.createElement('div');
                header.className = 'bg-slate-50 border-b border-slate-200/80 px-5 py-3.5 flex justify-between items-center';
                header.innerHTML = `<h2 class="text-base sm:text-lg font-bold text-slate-800">${section.category}</h2>`;
                card.appendChild(header);

                const list = document.createElement('ul');
                list.className = 'divide-y divide-slate-100';

                section.items.forEach((sentence, iIdx) => {
                    const li = document.createElement('li');
                    li.className = 'px-5 py-4 hover:bg-slate-50/60 transition';

                    const parsedHTML = sentence.replace(/\[(.*?)\]/g, (match, answerText) => {
                        totalBlanks++;
                        const uid = `blk-${section.id}-${iIdx}-${totalBlanks}`;
                        const widthEm = Math.max(answerText.length * 1.35 + 1.5, 4.5);

                        blankRegistry.push({ id: uid, answer: answerText });

                        return `<input type="text" id="${uid}" 
                                autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                                placeholder="?"
                                class="blank-input"
                                style="width: ${widthEm}em"
                                oninput="handleBlankInput('${uid}', '${answerText}')"
                                onkeydown="handleBlankKeydown(event, '${uid}', '${answerText}')"
                                onblur="handleBlankBlur('${uid}', '${answerText}')">`;
                    });

                    li.innerHTML = `<p class="text-slate-700 leading-8 text-sm sm:text-base break-keep">${parsedHTML}</p>`;
                    list.appendChild(li);
                });

                card.appendChild(list);
                container.appendChild(card);
            });

            updateBlankProgress();
        }

        function normalize(str) {
            // 공백, 하이픈, 가운뎃점 제거 후 소문자화
            return str.replace(/[\s\-·/]/g, '').toLowerCase();
        }

        // 타이핑 도중 정답과 일치하면 즉시 정답 처리
        function handleBlankInput(uid, correctAnswer) {
            const el = document.getElementById(uid);
            if (!el || el.dataset.status) return;

            if (normalize(el.value) === normalize(correctAnswer)) {
                markBlankCorrect(el, correctAnswer, true);
            }
        }

        // Enter 키 입력 시: 정답이면 통과, 틀렸으면 즉시 정답 노출
        function handleBlankKeydown(e, uid, correctAnswer) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const el = document.getElementById(uid);
                if (!el || el.dataset.status) return;

                if (normalize(el.value) === normalize(correctAnswer)) {
                    markBlankCorrect(el, correctAnswer, true);
                } else {
                    markBlankWrong(el, correctAnswer, true);
                }
            }
        }

        // 포커스를 잃었을 때(다른 칸 터치 등): 무언가 입력했는데 틀렸다면 즉시 정답 노출
        function handleBlankBlur(uid, correctAnswer) {
            const el = document.getElementById(uid);
            if (!el || el.dataset.status) return;

            const val = el.value.trim();
            if (val.length === 0) return; // 아무것도 안 적고 넘어간 경우는 보류

            if (normalize(val) === normalize(correctAnswer)) {
                markBlankCorrect(el, correctAnswer, false);
            } else {
                markBlankWrong(el, correctAnswer, false);
            }
        }

        function markBlankCorrect(el, correctAnswer, moveNext) {
            el.value = correctAnswer;
            el.classList.add('correct');
            el.dataset.status = 'correct';
            correctBlanks++;
            updateBlankProgress();
            if (moveNext) focusNextBlank(el.id);
        }

        function markBlankWrong(el, correctAnswer, moveNext) {
            const userTyped = el.value.trim();
            el.value = `${correctAnswer}`;
            el.title = `내가 쓴 답: ${userTyped}`;
            el.classList.add('wrong-revealed');
            el.dataset.status = 'wrong';
            wrongBlanks++;
            updateBlankProgress();
            if (moveNext) focusNextBlank(el.id);
        }

        function focusNextBlank(currentId) {
            const idx = blankRegistry.findIndex(b => b.id === currentId);
            for (let i = idx + 1; i < blankRegistry.length; i++) {
                const nextEl = document.getElementById(blankRegistry[i].id);
                if (nextEl && !nextEl.dataset.status) {
                    nextEl.focus();
                    break;
                }
            }
        }

        function revealAllBlanks() {
            blankRegistry.forEach(item => {
                const el = document.getElementById(item.id);
                if (el && !el.dataset.status) {
                    el.value = item.answer;
                    el.classList.add('wrong-revealed');
                    el.dataset.status = 'wrong';
                    wrongBlanks++;
                }
            });
            updateBlankProgress();
        }

        function resetBlanks() {
            renderBlanks();
        }

        function updateBlankProgress() {
            if (currentMode !== 'blank') return;
            const textEl = document.getElementById('progress-text');
            const correctBar = document.getElementById('progress-correct');
            const wrongBar = document.getElementById('progress-wrong');
            const labelEl = document.getElementById('progress-label');

            labelEl.innerText = `빈칸 인출 현황 (정답 ${correctBlanks} / 오답확인 ${wrongBlanks} / 전체 ${totalBlanks})`;
            textEl.innerText = `${correctBlanks + wrongBlanks} / ${totalBlanks}`;

            const cPct = totalBlanks === 0 ? 0 : (correctBlanks / totalBlanks) * 100;
            const wPct = totalBlanks === 0 ? 0 : (wrongBlanks / totalBlanks) * 100;
            correctBar.style.width = `${cPct}%`;
            wrongBar.style.width = `${wPct}%`;
        }

        // -------------------------------------------------------------------------
        // 2. 객관식 50문제 렌더링 및 채점 로직
        // -------------------------------------------------------------------------
        function renderMCQ() {
            const container = document.getElementById('mcq-container');
            container.innerHTML = '';

            mcqQuizData.forEach((item, qIdx) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6';
                card.id = `mcq-card-${qIdx}`;

                let optionsHTML = '';
                const numbers = ['①', '②', '③', '④'];
                item.options.forEach((opt, oIdx) => {
                    optionsHTML += `
                        <button onclick="selectMCQOption(${qIdx}, ${oIdx})" id="mcq-${qIdx}-opt-${oIdx}"
                            class="w-full text-left px-4 py-3 rounded-xl border border-slate-200 hover:bg-slate-50 transition flex items-start gap-2.5 text-sm sm:text-base text-slate-700 font-medium">
                            <span class="font-bold text-slate-400 mt-0.5">${numbers[oIdx]}</span>
                            <span class="break-keep">${opt}</span>
                        </button>
                    `;
                });

                card.innerHTML = `
                    <div class="flex items-start gap-2.5 mb-4">
                        <span class="bg-indigo-100 text-indigo-700 font-bold text-xs px-2.5 py-1 rounded-md shrink-0 mt-0.5">Q${qIdx + 1}</span>
                        <h3 class="font-bold text-slate-800 text-base sm:text-lg leading-snug break-keep">${item.q}</h3>
                    </div>
                    <div class="space-y-2.5 mb-3">
                        ${optionsHTML}
                    </div>
                    <div id="mcq-exp-${qIdx}" class="hidden mt-4 p-4 rounded-xl bg-slate-50 border border-slate-200 text-sm text-slate-700 leading-relaxed">
                        <span class="font-bold text-indigo-600 block mb-1">💡 핵심 해설</span>
                        ${item.exp}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectMCQOption(qIdx, selectedIdx) {
            if (mcqAnswered[qIdx] !== undefined) return; // 이미 푼 문제 방지
            mcqAnswered[qIdx] = selectedIdx;

            const item = mcqQuizData[qIdx];
            const isCorrect = (selectedIdx === item.ans);

            // 버튼 스타일 업데이트
            item.options.forEach((_, oIdx) => {
                const btn = document.getElementById(`mcq-${qIdx}-opt-${oIdx}`);
                btn.disabled = true;
                btn.classList.remove('hover:bg-slate-50');

                if (oIdx === item.ans) {
                    btn.className = "w-full text-left px-4 py-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 font-bold flex items-start gap-2.5 text-sm sm:text-base";
                    btn.querySelector('span').className = "font-bold text-emerald-600 mt-0.5";
                } else if (oIdx === selectedIdx && !isCorrect) {
                    btn.className = "w-full text-left px-4 py-3 rounded-xl border-2 border-rose-500 bg-rose-50 text-rose-900 font-bold flex items-start gap-2.5 text-sm sm:text-base";
                    btn.querySelector('span').className = "font-bold text-rose-600 mt-0.5";
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            // 해설 노출
            const expBox = document.getElementById(`mcq-exp-${qIdx}`);
            expBox.classList.remove('hidden');

            updateMCQProgress();
        }

        function resetMCQ() {
            mcqAnswered = {};
            renderMCQ();
            updateMCQProgress();
        }

        function updateMCQProgress() {
            if (currentMode !== 'mcq') return;
            const total = mcqQuizData.length;
            let cCount = 0;
            let wCount = 0;

            Object.keys(mcqAnswered).forEach(qIdx => {
                if (mcqAnswered[qIdx] === mcqQuizData[qIdx].ans) cCount++;
                else wCount++;
            });

            const textEl = document.getElementById('progress-text');
            const correctBar = document.getElementById('progress-correct');
            const wrongBar = document.getElementById('progress-wrong');
            const labelEl = document.getElementById('progress-label');

            labelEl.innerText = `객관식 풀이 현황 (정답 ${cCount} / 오답 ${wCount} / 전체 ${total})`;
            textEl.innerText = `${cCount + wCount} / ${total}`;

            correctBar.style.width = `${(cCount / total) * 100}%`;
            wrongBar.style.width = `${(wCount / total) * 100}%`;
        }

        // 앱 초기 실행
        window.onload = function() {
            renderCategoryFilters();
            renderBlanks();
            renderMCQ();
        };
    </script>
</body>
